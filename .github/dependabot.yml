version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
          day: 'sunday'
      target-branch: 'v3-development'
      labels: ['dependabot', 'dependencies']
      open-pull-requests-limit: 10
      commit-message:
          prefix: 'fix'
          prefix-development: 'build'
          include: 'scope'
      allow:
          - dependency-type: 'production'
      ignore:
          # @babel/runtime 8 drops the regenerator entry Babel 7's transform-runtime imports;
          # move it with the rest of the Babel toolchain, not on its own
          - dependency-name: '@babel/runtime'
            update-types: ['version-update:semver-major']

    - package-ecosystem: npm
      directory: 'kits/amplitude/amplitude-8'
      schedule:
          interval: weekly
          day: 'sunday'
      target-branch: 'v3-development'
      labels: ['dependabot', 'dependencies', 'kit']
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'fix'
          prefix-development: 'build'
          include: 'scope'
      allow:
          - dependency-type: 'production'
