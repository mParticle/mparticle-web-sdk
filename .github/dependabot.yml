version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
          day: 'sunday'
      target-branch: 'v3-development'
      labels: ['dependabot', 'dependencies']
      open-pull-requests-limit: 10
      commit-message:
          prefix: 'fix'
          prefix-development: 'build'
          include: 'scope'
      allow:
          - dependency-type: 'production'
          # Babel is dev-only, but @babel/runtime has to stay on the same major as the compiler
          - dependency-name: '@babel/*'
      groups:
          babel:
              patterns: ['@babel/*']

    - package-ecosystem: npm
      directory: 'kits/amplitude/amplitude-8'
      schedule:
          interval: weekly
          day: 'sunday'
      target-branch: 'v3-development'
      labels: ['dependabot', 'dependencies', 'kit']
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'fix'
          prefix-development: 'build'
          include: 'scope'
      allow:
          - dependency-type: 'production'
