name: QA V3 S3 OIDC Phase 1

on:
    workflow_dispatch:
        inputs:
            operation:
                description: Phase 1 operation
                required: true
                type: choice
                options:
                    - inspect-claims
                    - upload-validate
                default: inspect-claims

permissions: {}

# A run waiting for Environment approval holds this group until it is approved,
# rejected or times out, so reviewers must reject stale waiting runs.
concurrency:
    group: qa-v3-s3-oidc-phase1
    cancel-in-progress: false

# A new reviewed head needs a new, never-reused tag name. Tags are never moved.
env:
    EVIDENCE_TAG: qa-v3-s3-oidc-phase1-evidence-2

# Evidence order: create and protect the exact reviewed tag, allow only that
# tag in the Environment, inspect its claims, give its subject to Ops, provision
# the role, then validate upload from the same unchanged tag.
jobs:
    # Runs without an Environment so other refs fail before any approval wait.
    require-evidence-tag:
        name: Require the exact protected evidence tag
        permissions: {}
        runs-on: ubuntu-24.04
        timeout-minutes: 1
        steps:
            - name: Require the exact protected evidence tag
              run: |
                  set -eu
                  WORKFLOW_PATH='.github/workflows/qa-v3-s3-oidc-phase1.yml'
                  EXPECTED_REF="refs/tags/${EVIDENCE_TAG}"
                  EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/${WORKFLOW_PATH}"
                  EXPECTED_WORKFLOW_REF="${EXPECTED_WORKFLOW_REF}@${EXPECTED_REF}"
                  if [ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ] ||
                      [ "$GITHUB_REF_TYPE" != 'tag' ] ||
                      [ "$GITHUB_REF" != "$EXPECTED_REF" ] ||
                      [ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ]; then
                      echo 'This workflow runs only from the protected evidence tag.'
                      exit 1
                  fi

    inspect-claims:
        name: Inspect OIDC claims
        needs: require-evidence-tag
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        environment: v3-qa-upload
        permissions:
            id-token: write # Request a token only for claim inspection.
        steps:
            - name: Require the exact protected evidence tag
              run: |
                  set -eu
                  WORKFLOW_PATH='.github/workflows/qa-v3-s3-oidc-phase1.yml'
                  EXPECTED_REF="refs/tags/${EVIDENCE_TAG}"
                  EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/${WORKFLOW_PATH}"
                  EXPECTED_WORKFLOW_REF="${EXPECTED_WORKFLOW_REF}@${EXPECTED_REF}"
                  if [ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ] ||
                      [ "$GITHUB_REF_TYPE" != 'tag' ] ||
                      [ "$GITHUB_REF" != "$EXPECTED_REF" ] ||
                      [ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ]; then
                      echo 'This workflow runs only from the protected evidence tag.'
                      exit 1
                  fi

            - name: Inspect allowlisted identity metadata
              env:
                  EXPECTED_AUDIENCE: sts.amazonaws.com
                  EXPECTED_ENVIRONMENT: v3-qa-upload
              run: |
                  node <<'NODE'
                  class ClaimValidationError extends Error {}

                  async function main() {
                      const requestUrl =
                          process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
                      const requestToken =
                          process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
                      if (!requestUrl || !requestToken) {
                          throw new Error('OIDC request context is unavailable');
                      }

                      const url = new URL(requestUrl);
                      url.searchParams.set(
                          'audience',
                          process.env.EXPECTED_AUDIENCE
                      );
                      const response = await fetch(url, {
                          headers: {
                              Authorization: `Bearer ${requestToken}`,
                          },
                      });
                      if (!response.ok) {
                          throw new Error('OIDC token request failed');
                      }

                      const body = await response.json();
                      if (typeof body.value !== 'string') {
                          throw new Error('OIDC token response is invalid');
                      }
                      const segments = body.value.split('.');
                      if (segments.length !== 3) {
                          throw new Error('OIDC token format is invalid');
                      }

                      const claims = JSON.parse(
                          Buffer.from(segments[1], 'base64url').toString('utf8')
                      );
                      const allowlistedKeys = [
                          'iss',
                          'aud',
                          'sub',
                          'repository',
                          'repository_id',
                          'repository_owner_id',
                          'environment',
                          'ref',
                          'workflow_ref',
                      ];
                      const allowlistedClaims = Object.fromEntries(
                          allowlistedKeys.map((key) => [
                              key,
                              claims[key] ?? null,
                          ])
                      );
                      console.log(JSON.stringify(allowlistedClaims, null, 2));

                      const errors = [];
                      if (
                          claims.iss !==
                          'https://token.actions.githubusercontent.com'
                      ) {
                          errors.push('OIDC issuer did not match GitHub.');
                      }
                      if (claims.aud !== process.env.EXPECTED_AUDIENCE) {
                          errors.push('OIDC audience did not match.');
                      }
                      if (
                          typeof claims.sub !== 'string' ||
                          claims.sub.length === 0
                      ) {
                          errors.push('OIDC subject was empty or invalid.');
                      }
                      if (
                          claims.repository !==
                          process.env.GITHUB_REPOSITORY
                      ) {
                          errors.push('OIDC repository did not match.');
                      }
                      if (
                          typeof claims.repository_id !== 'string' ||
                          claims.repository_id.length === 0
                      ) {
                          errors.push('OIDC repository ID was empty or invalid.');
                      }
                      if (
                          typeof claims.repository_owner_id !== 'string' ||
                          claims.repository_owner_id.length === 0
                      ) {
                          errors.push(
                              'OIDC repository owner ID was empty or invalid.'
                          );
                      }
                      if (
                          claims.environment !==
                          process.env.EXPECTED_ENVIRONMENT
                      ) {
                          errors.push('OIDC Environment did not match.');
                      }
                      if (claims.ref !== process.env.GITHUB_REF) {
                          errors.push('OIDC ref did not match.');
                      }
                      if (
                          claims.workflow_ref !==
                          process.env.GITHUB_WORKFLOW_REF
                      ) {
                          errors.push('OIDC workflow ref did not match exactly.');
                      }
                      if (errors.length > 0) {
                          throw new ClaimValidationError(errors.join('\n'));
                      }
                  }

                  main().catch((error) => {
                      if (error instanceof ClaimValidationError) {
                          console.error(error.message);
                      } else {
                          console.error('OIDC claim inspection failed.');
                      }
                      process.exit(1);
                  });
                  NODE

    # Starts only after claim inspection finishes, so an upload-validate run
    # asks for Environment approval twice: once per job.
    upload-validate:
        name: Validate candidate upload permissions
        if: ${{ inputs.operation == 'upload-validate' }}
        needs: [require-evidence-tag, inspect-claims]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: v3-qa-upload
        permissions:
            contents: read # Read the reviewed V3 artifact.
            id-token: write # Exchange OIDC for short-lived AWS credentials.
        # Only short-lived OIDC credentials authenticate to AWS.
        # Environment secrets mask identifiers; secrecy is not authorization.
        # Each secret is scoped to the steps that need it.
        env:
            AWS_CLI_ERROR_FORMAT: json
            AWS_PAGER: ''
        steps:
            - name: Require the exact protected evidence tag
              run: |
                  set -eu
                  WORKFLOW_PATH='.github/workflows/qa-v3-s3-oidc-phase1.yml'
                  EXPECTED_REF="refs/tags/${EVIDENCE_TAG}"
                  EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/${WORKFLOW_PATH}"
                  EXPECTED_WORKFLOW_REF="${EXPECTED_WORKFLOW_REF}@${EXPECTED_REF}"
                  if [ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ] ||
                      [ "$GITHUB_REF_TYPE" != 'tag' ] ||
                      [ "$GITHUB_REF" != "$EXPECTED_REF" ] ||
                      [ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ]; then
                      echo 'This workflow runs only from the protected evidence tag.'
                      exit 1
                  fi

            - name: Checkout reviewed source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 1
                  ref: ${{ github.sha }}

            - name: Validate local inputs and committed artifact
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
                  SDK_ARTIFACT_PREFIX: ${{ secrets.SDK_ARTIFACT_PREFIX }}
                  SDK_POINTER_DENIAL_PREFIX: ${{ secrets.SDK_POINTER_DENIAL_PREFIX }}
                  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
              run: |
                  set -eu
                  for value in \
                      "$AWS_ACCOUNT_ID" \
                      "$AWS_REGION" \
                      "$SDK_ARTIFACT_BUCKET" \
                      "$SDK_ARTIFACT_PREFIX" \
                      "$SDK_POINTER_DENIAL_PREFIX" \
                      "$AWS_ROLE_ARN"; do
                      if [ -z "$value" ]; then
                          echo 'A required Environment secret is missing.'
                          exit 1
                      fi
                  done

                  case "$AWS_ACCOUNT_ID" in
                      *[!0-9]*|'')
                          echo 'The expected account configuration is invalid.'
                          exit 1
                          ;;
                  esac
                  if [ "${#AWS_ACCOUNT_ID}" -ne 12 ]; then
                      echo 'The expected account configuration is invalid.'
                      exit 1
                  fi

                  # Prefixes must be normalized relative keys with at least two
                  # segments, so no two spellings name the same namespace.
                  require_normalized_prefix() {
                      case "$1" in
                          ''|/*|*/|*//*|*[!A-Za-z0-9._/-]*)
                              echo "$2"
                              exit 1
                              ;;
                          .|..|./*|../*|*/.|*/..|*/./*|*/../*)
                              echo "$2"
                              exit 1
                              ;;
                          */*) ;;
                          *)
                              echo "$2"
                              exit 1
                              ;;
                      esac
                  }

                  CANDIDATE_PREFIX="${SDK_ARTIFACT_PREFIX%/}"
                  POINTER_DENIAL_PREFIX="${SDK_POINTER_DENIAL_PREFIX%/}"
                  require_normalized_prefix "$CANDIDATE_PREFIX" \
                      'The artifact prefix configuration is invalid.'
                  require_normalized_prefix "$POINTER_DENIAL_PREFIX" \
                      'The pointer denial configuration is invalid.'
                  # The workflow cannot prove the pointer prefix is the real
                  # pointer namespace; Ops must confirm that mapping.
                  case "${POINTER_DENIAL_PREFIX}/" in
                      "${CANDIDATE_PREFIX}/"*)
                          echo 'The pointer denial namespace is invalid.'
                          exit 1
                          ;;
                  esac
                  case "${CANDIDATE_PREFIX}/" in
                      "${POINTER_DENIAL_PREFIX}/"*)
                          echo 'The pointer denial namespace is invalid.'
                          exit 1
                          ;;
                  esac

                  VERSION="$(node -p "require('./package.json').version")"
                  case "$VERSION" in
                      3.*) ;;
                      *)
                          echo 'The checked-out source is not a V3 release.'
                          exit 1
                          ;;
                  esac

                  # This experiment transports the committed bundle. It does
                  # not attest build reproducibility or release provenance.
                  ARTIFACT_PATH='dist/mparticle.js'
                  if [ ! -s "$ARTIFACT_PATH" ]; then
                      echo 'The reviewed V3 artifact is unavailable.'
                      exit 1
                  fi
                  if ! EMBEDDED_VERSION="$(
                      ARTIFACT_PATH="$ARTIFACT_PATH" node <<'NODE'
                  const fs = require('fs');
                  const source = fs.readFileSync(
                      process.env.ARTIFACT_PATH,
                      'utf8'
                  );
                  const match = source.match(/\bvar version = "([^"]+)";/);
                  if (!match) {
                      process.exit(1);
                  }
                  process.stdout.write(match[1]);
                  NODE
                  )"; then
                      echo 'The embedded artifact version could not be parsed.'
                      exit 1
                  fi
                  if [ "$EMBEDDED_VERSION" != "$VERSION" ]; then
                      echo 'The embedded artifact version does not match.'
                      exit 1
                  fi

                  TEST_KEY="${CANDIDATE_PREFIX}/${VERSION}/"
                  TEST_KEY="${TEST_KEY}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
                  TEST_KEY="${TEST_KEY}mparticle.js"
                  DENIED_KEY="${CANDIDATE_PREFIX%/*}/"
                  DENIED_KEY="${DENIED_KEY}phase1-denied-"
                  DENIED_KEY="${DENIED_KEY}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  POINTER_DENIED_KEY="${POINTER_DENIAL_PREFIX}/"
                  POINTER_DENIED_KEY="${POINTER_DENIED_KEY}phase1-denied-"
                  POINTER_DENIED_KEY="${POINTER_DENIED_KEY}${GITHUB_RUN_ID}-"
                  POINTER_DENIED_KEY="${POINTER_DENIED_KEY}${GITHUB_RUN_ATTEMPT}"

                  umask 077
                  printf '%s' "$TEST_KEY" > "$RUNNER_TEMP/test-key"
                  printf '%s' "$DENIED_KEY" > "$RUNNER_TEMP/denied-key"
                  printf '%s' "$POINTER_DENIED_KEY" \
                      > "$RUNNER_TEMP/pointer-denied-key"

            - name: Prepare normalized AWS error parser
              run: |
                  cat > "$RUNNER_TEMP/normalized-aws-error.js" <<'NODE'
                  const fs = require('fs');
                  const text = fs.readFileSync(process.argv[2], 'utf8');
                  let code = '';
                  try {
                      const parsed = JSON.parse(text);
                      code = parsed.Code || parsed.code || '';
                  } catch {
                      const patterns = [
                          /"Code"\s*:\s*"([A-Za-z][A-Za-z0-9]{0,63})"/,
                          /error occurred \(([A-Za-z][A-Za-z0-9]{0,63})\)/,
                          /\b(AccessDenied|Forbidden|PreconditionFailed)\b/,
                      ];
                      for (const pattern of patterns) {
                          const match = text.match(pattern);
                          if (match) {
                              code = match[1];
                              break;
                          }
                      }
                  }
                  if (!/^[A-Za-z][A-Za-z0-9]{0,63}$/.test(code)) {
                      code = 'Unknown';
                  }
                  process.stdout.write(code);
                  NODE

            - name: Configure short-lived AWS credentials
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: phase1-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload committed artifact, read back, and verify transport
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  ARTIFACT_PATH='dist/mparticle.js'
                  TEST_KEY="$(cat "$RUNNER_TEMP/test-key")"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  DOWNLOAD_PATH="${TEMP_DIRECTORY}/download"
                  ERROR_PATH="${TEMP_DIRECTORY}/error"
                  PUT_OUTPUT_PATH="${TEMP_DIRECTORY}/put-output"
                  LOCAL_SIZE="$(wc -c < "$ARTIFACT_PATH" | tr -d ' ')"
                  LOCAL_SHA256="$(sha256sum "$ARTIFACT_PATH" | cut -d ' ' -f 1)"

                  if ! aws s3api put-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$TEST_KEY" \
                      --body "$ARTIFACT_PATH" \
                      --if-none-match '*' \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      > "$PUT_OUTPUT_PATH" 2> "$ERROR_PATH"; then
                      ERROR_CODE="$(
                          node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                      )"
                      echo "Candidate upload failed (${ERROR_CODE})."
                      exit 1
                  fi

                  # The version ID stays in a runner-local file; never log it.
                  umask 077
                  if ! PUT_OUTPUT_PATH="$PUT_OUTPUT_PATH" \
                      VERSION_ID_PATH="$RUNNER_TEMP/test-version-id" \
                      node <<'NODE'
                  const fs = require('fs');
                  const output = JSON.parse(
                      fs.readFileSync(process.env.PUT_OUTPUT_PATH, 'utf8')
                  );
                  if (
                      typeof output.VersionId === 'string' &&
                      output.VersionId.length > 0
                  ) {
                      fs.writeFileSync(
                          process.env.VERSION_ID_PATH,
                          output.VersionId,
                          { mode: 0o600 }
                      );
                  }
                  NODE
                  then
                      echo 'Candidate upload response could not be parsed.'
                      exit 1
                  fi

                  if ! aws s3api get-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$TEST_KEY" \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      "$DOWNLOAD_PATH" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      ERROR_CODE="$(
                          node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                      )"
                      echo "Candidate readback failed (${ERROR_CODE})."
                      exit 1
                  fi

                  DOWNLOADED_SIZE="$(
                      wc -c < "$DOWNLOAD_PATH" | tr -d ' '
                  )"
                  DOWNLOADED_SHA256="$(
                      sha256sum "$DOWNLOAD_PATH" | cut -d ' ' -f 1
                  )"
                  if [ "$LOCAL_SIZE" != "$DOWNLOADED_SIZE" ] ||
                      [ "$LOCAL_SHA256" != "$DOWNLOADED_SHA256" ]; then
                      echo 'Candidate readback did not match the source.'
                      exit 1
                  fi

                  echo 'Committed artifact transport and readback validated.'

            - name: Prove out-of-prefix writes are denied
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  DENIED_KEY="$(cat "$RUNNER_TEMP/denied-key")"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  BODY_PATH="${TEMP_DIRECTORY}/body"
                  ERROR_PATH="${TEMP_DIRECTORY}/error"
                  printf 'phase1-denial-check\n' > "$BODY_PATH"

                  if aws s3api put-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$DENIED_KEY" \
                      --body "$BODY_PATH" \
                      --if-none-match '*' \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      echo 'The out-of-prefix write was unexpectedly allowed.'
                      echo 'Stop all runs and request immediate Ops cleanup.'
                      exit 1
                  fi

                  ERROR_CODE="$(
                      node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                  )"
                  case "$ERROR_CODE" in
                      AccessDenied|Forbidden) ;;
                      *)
                          echo "Out-of-prefix denial failed (${ERROR_CODE})."
                          exit 1
                          ;;
                  esac
                  echo "Out-of-prefix write denied (${ERROR_CODE})."

            - name: Prove pointer-namespace decoy writes are denied
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  POINTER_DENIED_KEY="$(
                      cat "$RUNNER_TEMP/pointer-denied-key"
                  )"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  BODY_PATH="${TEMP_DIRECTORY}/body"
                  ERROR_PATH="${TEMP_DIRECTORY}/error"
                  printf 'phase1-pointer-denial-check\n' > "$BODY_PATH"

                  if aws s3api put-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$POINTER_DENIED_KEY" \
                      --body "$BODY_PATH" \
                      --if-none-match '*' \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      echo 'Pointer-namespace decoy write unexpectedly succeeded.'
                      echo 'Stop all runs and request immediate Ops cleanup.'
                      exit 1
                  fi

                  ERROR_CODE="$(
                      node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                  )"
                  case "$ERROR_CODE" in
                      AccessDenied|Forbidden) ;;
                      *)
                          echo "Pointer-namespace denial failed (${ERROR_CODE})."
                          exit 1
                          ;;
                  esac
                  echo "Pointer-namespace write denied (${ERROR_CODE})."

            # A create-only request header only constrains this workflow's own
            # request. Denial of an unconditional overwrite must come from Ops
            # policy (for example, requiring s3:if-none-match on PutObject).
            - name: Prove unconditional candidate overwrite is denied
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  TEST_KEY="$(cat "$RUNNER_TEMP/test-key")"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  BODY_PATH="${TEMP_DIRECTORY}/body"
                  ERROR_PATH="${TEMP_DIRECTORY}/error"
                  printf 'phase1-overwrite-check-%s-%s\n' \
                      "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$BODY_PATH"

                  if aws s3api put-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$TEST_KEY" \
                      --body "$BODY_PATH" \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      echo 'Candidate overwrite was unexpectedly allowed.'
                      echo 'Stop all runs and request immediate Ops review.'
                      exit 1
                  fi

                  ERROR_CODE="$(
                      node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                  )"
                  case "$ERROR_CODE" in
                      AccessDenied|Forbidden) ;;
                      *)
                          echo "Candidate overwrite denial failed (${ERROR_CODE})."
                          exit 1
                          ;;
                  esac
                  echo "Candidate overwrite denied (${ERROR_CODE})."

            - name: Prove candidate deletion is denied
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  TEST_KEY="$(cat "$RUNNER_TEMP/test-key")"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  ERROR_PATH="${TEMP_DIRECTORY}/error"

                  if aws s3api delete-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$TEST_KEY" \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      echo 'Candidate deletion was unexpectedly allowed.'
                      exit 1
                  fi

                  ERROR_CODE="$(
                      node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                  )"
                  case "$ERROR_CODE" in
                      AccessDenied|Forbidden) ;;
                      *)
                          echo "Candidate deletion denial failed (${ERROR_CODE})."
                          exit 1
                          ;;
                  esac
                  echo "Candidate deletion denied (${ERROR_CODE})."

            - name: Prove candidate version deletion is denied
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  VERSION_ID_PATH="$RUNNER_TEMP/test-version-id"
                  if [ ! -s "$VERSION_ID_PATH" ]; then
                      echo 'No version ID was returned; versioning appears disabled.'
                      exit 0
                  fi
                  TEST_KEY="$(cat "$RUNNER_TEMP/test-key")"
                  VERSION_ID="$(cat "$VERSION_ID_PATH")"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  ERROR_PATH="${TEMP_DIRECTORY}/error"

                  if aws s3api delete-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$TEST_KEY" \
                      --version-id "$VERSION_ID" \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      echo 'Candidate version deletion was unexpectedly allowed.'
                      echo 'Stop all runs and request immediate Ops review.'
                      exit 1
                  fi

                  ERROR_CODE="$(
                      node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                  )"
                  case "$ERROR_CODE" in
                      AccessDenied|Forbidden) ;;
                      *)
                          echo "Candidate version deletion denial failed (${ERROR_CODE})."
                          exit 1
                          ;;
                  esac
                  echo "Candidate version deletion denied (${ERROR_CODE})."

            - name: Confirm candidate remains readable and unchanged
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET }}
              run: |
                  set -eu
                  ARTIFACT_PATH='dist/mparticle.js'
                  TEST_KEY="$(cat "$RUNNER_TEMP/test-key")"
                  TEMP_DIRECTORY="$(mktemp -d)"
                  trap 'rm -rf "$TEMP_DIRECTORY"' EXIT
                  DOWNLOAD_PATH="${TEMP_DIRECTORY}/download"
                  ERROR_PATH="${TEMP_DIRECTORY}/error"
                  LOCAL_SIZE="$(wc -c < "$ARTIFACT_PATH" | tr -d ' ')"
                  LOCAL_SHA256="$(sha256sum "$ARTIFACT_PATH" | cut -d ' ' -f 1)"

                  if ! aws s3api get-object \
                      --bucket "$SDK_ARTIFACT_BUCKET" \
                      --key "$TEST_KEY" \
                      --expected-bucket-owner "$AWS_ACCOUNT_ID" \
                      "$DOWNLOAD_PATH" \
                      > /dev/null 2> "$ERROR_PATH"; then
                      ERROR_CODE="$(
                          node "$RUNNER_TEMP/normalized-aws-error.js" "$ERROR_PATH"
                      )"
                      echo "Final candidate readback failed (${ERROR_CODE})."
                      exit 1
                  fi

                  DOWNLOADED_SIZE="$(
                      wc -c < "$DOWNLOAD_PATH" | tr -d ' '
                  )"
                  DOWNLOADED_SHA256="$(
                      sha256sum "$DOWNLOAD_PATH" | cut -d ' ' -f 1
                  )"
                  if [ "$LOCAL_SIZE" != "$DOWNLOADED_SIZE" ] ||
                      [ "$LOCAL_SHA256" != "$DOWNLOADED_SHA256" ] ||
                      ! cmp -s "$ARTIFACT_PATH" "$DOWNLOAD_PATH"; then
                      echo 'Final candidate readback did not match the source.'
                      exit 1
                  fi

                  echo 'Phase 1 transport validation completed successfully.'
