name: QA V3 S3 OIDC Phase 1

on:
    workflow_dispatch:
        inputs:
            operation:
                description: Phase 1 operation
                required: true
                type: choice
                options:
                    - inspect-claims
                    - upload-validate
                default: inspect-claims

permissions: {}

concurrency:
    group: qa-v3-s3-oidc-phase1
    cancel-in-progress: false

jobs:
    select-experiment-ref:
        name: Select the reviewed experiment ref
        if: ${{ inputs.operation == 'inspect-claims' }}
        permissions: {}
        runs-on: ubuntu-24.04
        timeout-minutes: 1
        steps:
            - name: Stop claim inspection on the registration ref
              run: |
                  echo 'Select the reviewed experiment ref to inspect claims.'
                  exit 1

    upload-validate:
        name: Upload validation unavailable on this ref
        if: ${{ inputs.operation == 'upload-validate' }}
        permissions: {}
        runs-on: ubuntu-24.04
        timeout-minutes: 1
        steps:
            - name: Stop guarded upload dispatch
              run: |
                  echo 'Upload validation is unavailable on this ref.'
                  exit 1
