name: 'V3 Release Please'

# On each push to main, Release Please opens or updates the V3 release pull
# request. When that pull request merges, it publishes the GitHub release,
# which creates the v3.X.Y tag, and dispatches v3-release-step-1.yml on that
# tag with dryRun=false using the built-in token. Release Please runs as the
# release machine user, so pushes to the release pull request run its checks
# (a GITHUB_TOKEN push would not), and v3-release-please-dist.yml commits the
# bundles there. The repository variable V3_RELEASE_PLEASE_ENABLED is the kill
# switch.

on:
    push:
        branches:
            - main

permissions: {}

# A run in progress always finishes. Each run reads every commit since the
# last release, so a queued run that a newer push replaces loses nothing.
concurrency:
    group: v3-release-please
    cancel-in-progress: false

jobs:
    release-please:
        name: Release Please
        if: ${{ github.repository_owner == 'mParticle' && vars.V3_RELEASE_PLEASE_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read # The action writes with the machine user's token.
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Run Release Please
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
                  target-branch: main
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    dispatch-step-1:
        name: Dispatch V3 Release - Step 1
        needs: release-please
        if: >-
            ${{
                github.repository_owner == 'mParticle' &&
                vars.V3_RELEASE_PLEASE_ENABLED == 'true' &&
                needs.release-please.outputs.release_created == 'true' &&
                startsWith(needs.release-please.outputs.tag_name, 'v3.')
            }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write # Dispatches v3-release-step-1.yml with the built-in token once a release is created.
        steps:
            - name: Dispatch V3 Release - Step 1
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_PLEASE_ENABLED: ${{ vars.V3_RELEASE_PLEASE_ENABLED }}
                  RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
              run: |
                  set -eu
                  if [ "${RELEASE_PLEASE_ENABLED:-}" != 'true' ]; then
                      echo "V3_RELEASE_PLEASE_ENABLED must be 'true' to dispatch Step 1"
                      exit 1
                  fi
                  if [ "${RELEASE_CREATED:-}" != 'true' ]; then
                      echo "release_created must be 'true' to dispatch Step 1"
                      exit 1
                  fi
                  if [ "$(printf '%s\n' "${TAG_NAME:-}" | wc -l)" -ne 1 ] ||
                      ! printf '%s\n' "${TAG_NAME:-}" |
                          grep -Eq '^v3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
                      echo "Invalid stable V3 release tag: ${TAG_NAME:-}"
                      exit 1
                  fi
                  gh workflow run v3-release-step-1.yml --ref "$TAG_NAME" -f dryRun=false
                  {
                      printf '## V3 release created\n\n'
                      printf -- '- Tag: `%s`\n' "$TAG_NAME"
                      printf -- '- Dispatched: `gh workflow run v3-release-step-1.yml --ref %s -f dryRun=false`\n\n' "$TAG_NAME"
                      printf 'If Step 1 fails after packaging or staging has started, use **Re-run failed jobs** on that original Step 1 run so the candidate build ID stays unchanged. Only dispatch a fresh Step 1 run from the tag if the automatic dispatch did not start or failed before packaging or staging:\n\n```sh\n'
                      printf 'gh workflow run v3-release-step-1.yml --ref %s -f dryRun=false\n' "$TAG_NAME"
                      printf '```\n'
                  } >> "$GITHUB_STEP_SUMMARY"
