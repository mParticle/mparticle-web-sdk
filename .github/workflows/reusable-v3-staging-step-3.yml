name: 'Reusable V3 Step 3: Atomic Production Promotion'

# Requires the private exact-identity downstream validator configuration.
# Freeze-ruleset removal remains an external operation authenticated through
# private repository configuration.
# npm audit signatures plus the explicit provenance parser verify the registry
# bundle, subject/integrity, repository, top-level caller, and ref. Supported npm
# tooling cannot prove the live trusted-publisher configuration or environment
# approval; Step 1's disposable live publication smoke remains an activation
# prerequisite.

on:
    workflow_call:
        inputs:
            release_tag:
                description: Published stable tag on the v3 release topology
                required: true
                type: string
            expected_main_sha:
                description: Frozen source SHA currently expected on main
                required: true
                type: string
            expected_release_order_a_sha:
                description: Expected v3-release-order-a SHA
                required: true
                type: string
            expected_release_order_b_sha:
                description: Expected v3-release-order-b SHA
                required: true
                type: string
            expected_release_order_c_sha:
                description: Expected v3-release-order-c SHA
                required: true
                type: string
            lifecycle_deployment_id:
                description: Durable Step 1 deployment record ID
                required: true
                type: number
            cycle_id:
                description: Deterministic active release cycle ID
                required: true
                type: string
            cycle_deployment_id:
                description: Durable active release cycle deployment ID
                required: true
                type: number
        secrets:
            downstream_validation_endpoint:
                description: Private HTTPS exact-candidate validator endpoint
                required: true
            downstream_validation_token:
                description: Validator bearer credential
                required: true

concurrency:
    group: mparticle-web-sdk-v3-release
    cancel-in-progress: false

permissions:
    actions: read
    attestations: read
    contents: write
    deployments: write

jobs:
    promote-final-destinations:
        if: vars.V3_RELEASE_ACTIVATED == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout trusted promotion implementation
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Setup pinned Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24.19.0
                  registry-url: https://registry.npmjs.org

            - name: Validate final-promotion caller contract
              env:
                  EXPECTED_A_SHA: ${{ inputs.expected_release_order_a_sha }}
                  EXPECTED_B_SHA: ${{ inputs.expected_release_order_b_sha }}
                  EXPECTED_C_SHA: ${{ inputs.expected_release_order_c_sha }}
                  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
                  EXPECTED_CALLER_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/staging-step-3.yml@refs/heads/main
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  set -eu
                  test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_CALLER_WORKFLOW_REF"
                  test "$GITHUB_REPOSITORY" = "mParticle/mparticle-web-sdk"
                  test "$GITHUB_REPOSITORY_OWNER" = mParticle
                  test "$GITHUB_EVENT_NAME" = workflow_dispatch
                  test "$GITHUB_REF" = refs/heads/main
                  node - <<'NODE'
                  const promotion = require('./scripts/release/promotion');
                  promotion.assertStableTag(process.env.RELEASE_TAG);
                  [
                      process.env.EXPECTED_MAIN_SHA,
                      process.env.EXPECTED_A_SHA,
                      process.env.EXPECTED_B_SHA,
                      process.env.EXPECTED_C_SHA,
                  ].forEach((sha, index) =>
                      promotion.assertGitSha(sha, `expected_sha_${index}`)
                  );
                  NODE

            - name: Download trusted immutable GitHub Release records
              id: identity
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  set -eu
                  RECORDS="$RUNNER_TEMP/release-records"
                  mkdir -p "$RECORDS"
                  gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                      > "$RECORDS/github-release.json"
                  gh release download "$RELEASE_TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --dir "$RECORDS" \
                      --pattern candidate-manifest.json \
                      --pattern release-envelope.json
                  node scripts/release/promotion.js resolve \
                      --record-directory "$RECORDS" \
                      --tag "$RELEASE_TAG"

            - name: Checkout exact recorded candidate
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  ref: ${{ steps.identity.outputs.candidate_sha }}

            - name: Download exact recorded package artifact
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
              with:
                  artifact-ids: ${{ steps.identity.outputs.artifact_id }}
                  github-token: ${{ github.token }}
                  repository: ${{ steps.identity.outputs.origin_repository }}
                  run-id: ${{ steps.identity.outputs.origin_run_id }}
                  path: ${{ runner.temp }}/release-artifacts

            - name: Verify tag release artifacts attestations and npm
              env:
                  ARTIFACT_DIGEST: ${{ steps.identity.outputs.artifact_digest }}
                  ARTIFACT_ID: ${{ steps.identity.outputs.artifact_id }}
                  CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
                  CYCLE_DEPLOYMENT_ID: ${{ inputs.cycle_deployment_id }}
                  CYCLE_ID: ${{ inputs.cycle_id }}
                  DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
                  EXPECTED_LIFECYCLE_DEPLOYMENT_ID: ${{ inputs.lifecycle_deployment_id }}
                  GH_TOKEN: ${{ github.token }}
                  ORIGIN_REPOSITORY: ${{ steps.identity.outputs.origin_repository }}
                  ORIGIN_RUN_ATTEMPT: ${{ steps.identity.outputs.origin_run_attempt }}
                  ORIGIN_RUN_ID: ${{ steps.identity.outputs.origin_run_id }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
                  SIGNER_DIGEST: ${{ steps.identity.outputs.signer_digest }}
                  SIGNER_WORKFLOW: ${{ steps.identity.outputs.signer_workflow }}
                  RECORDED_CYCLE_DEPLOYMENT_ID: ${{ steps.identity.outputs.cycle_deployment_id }}
                  RECORDED_CYCLE_ID: ${{ steps.identity.outputs.cycle_id }}
                  RECORDED_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
              run: |
                  set -eu
                  test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
                  test "$EXPECTED_LIFECYCLE_DEPLOYMENT_ID" = "$DEPLOYMENT_ID"
                  test "$CYCLE_DEPLOYMENT_ID" = \
                      "$RECORDED_CYCLE_DEPLOYMENT_ID"
                  test "$CYCLE_ID" = "$RECORDED_CYCLE_ID"
                  SOURCE_SHA="$RECORDED_SOURCE_SHA"
                  test "$(git rev-list --parents -n 1 "$CANDIDATE_SHA")" = \
                      "$CANDIDATE_SHA $SOURCE_SHA"
                  TAG_SHA="$(git ls-remote --exit-code origin \
                      "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
                  test "$TAG_SHA" = "$CANDIDATE_SHA"
                  METADATA="$(gh api \
                      "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
                  test "$(jq -r .id <<<"$METADATA")" = "$ARTIFACT_ID"
                  test "$(jq -r .expired <<<"$METADATA")" = false
                  test "$(jq -r .workflow_run.id <<<"$METADATA")" = \
                      "$ORIGIN_RUN_ID"
                  test "$(jq -r .created_by.login <<<"$METADATA")" = \
                      "github-actions[bot]"
                  RUN="$(gh api \
                      "repos/${ORIGIN_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}")"
                  test "$(jq -r .repository.full_name <<<"$RUN")" = \
                      "$ORIGIN_REPOSITORY"
                  test "$(jq -r .path <<<"$RUN")" = \
                      ".github/workflows/staging-step-1.yml"
                  test "$(jq -r .head_branch <<<"$RUN")" = main
                  test "$(jq -r .head_sha <<<"$RUN")" = "$SOURCE_SHA"
                  test "$(jq -r .run_attempt <<<"$RUN")" = \
                      "$ORIGIN_RUN_ATTEMPT"
                  test "$(jq -r .digest <<<"$METADATA" | sed 's/^sha256://')" = \
                      "${ARTIFACT_DIGEST#sha256:}"
                  for SUBJECT in \
                      "$RUNNER_TEMP/release-records/candidate-manifest.json" \
                      "$RUNNER_TEMP/release-records/release-envelope.json" \
                      "$RUNNER_TEMP/release-artifacts"/*; do
                      gh attestation verify "$SUBJECT" \
                          --repo "$GITHUB_REPOSITORY" \
                          --hostname github.com \
                          --signer-workflow "$SIGNER_WORKFLOW" \
                          --signer-digest "$SIGNER_DIGEST" \
                          --source-ref refs/heads/main \
                          --source-digest "$SIGNER_DIGEST" \
                          --deny-self-hosted-runners
                  done
                  node scripts/release/promotion.js verify-published \
                      --artifact-directory "$RUNNER_TEMP/release-artifacts" \
                      --record-directory "$RUNNER_TEMP/release-records" \
                      --release-json \
                      "$RUNNER_TEMP/release-records/github-release.json" \
                      --repository-root "$PWD" \
                      --tag "$RELEASE_TAG"
                  git diff --name-only --no-renames \
                      "$SOURCE_SHA" "$CANDIDATE_SHA" |
                      while IFS= read -r FILE; do
                          case "$FILE" in
                              CHANGELOG.md|package.json|package-lock.json|\
                              .release/candidate-manifest.json|\
                              .release/changelog-range.json|\
                              .release/release-notes.md|\
                              dist/*|kits/*/dist/*|kits/*/package.json|\
                              kits/*/package-lock.json) ;;
                              *) echo "Unexpected candidate path: $FILE"; exit 1 ;;
                          esac
                      done
                  gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}" \
                      > "$RUNNER_TEMP/lifecycle-deployment.json"
                  gh api --paginate --slurp \
                      "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses?per_page=100" \
                      > "$RUNNER_TEMP/lifecycle-statuses.json"
                  gh api \
                      "repos/${GITHUB_REPOSITORY}/deployments/${CYCLE_DEPLOYMENT_ID}" \
                      > "$RUNNER_TEMP/release-cycle.json"
                  gh api --paginate --slurp \
                      "repos/${GITHUB_REPOSITORY}/deployments/${CYCLE_DEPLOYMENT_ID}/statuses?per_page=100" \
                      > "$RUNNER_TEMP/release-cycle-statuses.json"
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const {expectedIdentityFromEnvelope} =
                      require('./scripts/release/promotion');
                  const {validateCycleDeployment} =
                      require('./scripts/release/release-cycle');
                  const {validateDeployment} =
                      require('./scripts/release/lifecycle-record');
                  const envelope = JSON.parse(fs.readFileSync(
                      `${process.env.RUNNER_TEMP}/release-records/release-envelope.json`
                  ));
                  const expected = expectedIdentityFromEnvelope(envelope);
                  if (expected.deploymentId !== Number(process.env.DEPLOYMENT_ID)) {
                      throw new Error('Lifecycle deployment ID mismatch');
                  }
                  const history = validateDeployment({
                      deployment: JSON.parse(fs.readFileSync(
                          `${process.env.RUNNER_TEMP}/lifecycle-deployment.json`
                      )),
                      identity: {
                          actionsArtifacts: envelope.actions_artifacts,
                          callerWorkflow: envelope.caller_workflow,
                          candidateSha: expected.candidateSha,
                          cycleDeploymentId: expected.cycleDeploymentId,
                          cycleId: expected.cycleId,
                          manifestSha256: expected.manifestSha256,
                          originatingRun: envelope.originating_run,
                          signerWorkflow: envelope.attestation_signer,
                          sourceSha: expected.sourceSha,
                          version: expected.version,
                      },
                      repository: process.env.GITHUB_REPOSITORY,
                      statuses: JSON.parse(fs.readFileSync(
                          `${process.env.RUNNER_TEMP}/lifecycle-statuses.json`
                      )),
                  });
                  if (!['published', 'promoted'].includes(history.at(-1))) {
                      throw new Error(
                          'Lifecycle is not published or exactly promoted'
                      );
                  }
                  const cycleDeployment = JSON.parse(fs.readFileSync(
                      `${process.env.RUNNER_TEMP}/release-cycle.json`
                  ));
                  const cycle = validateCycleDeployment({
                      cycleDeploymentId: expected.cycleDeploymentId,
                      deployment: cycleDeployment,
                      expectedCycleId: expected.cycleId,
                      intentPullNumber:
                          cycleDeployment.payload.intent_pull_number,
                      repository: process.env.GITHUB_REPOSITORY,
                      sourceSha: cycleDeployment.payload.source_sha,
                      statuses: JSON.parse(fs.readFileSync(
                          `${process.env.RUNNER_TEMP}/release-cycle-statuses.json`
                      )),
                      version: expected.version,
                  });
                  if (
                      cycle.state !== 'active' ||
                      cycle.effectiveSourceSha !== expected.sourceSha
                  ) {
                      throw new Error('Promotion release-cycle identity mismatch');
                  }
                  NODE
                  AUDIT_ROOT="$RUNNER_TEMP/npm-signature-audit"
                  mkdir -p "$AUDIT_ROOT"
                  node - "$AUDIT_ROOT/package.json" <<'NODE'
                  const fs = require('node:fs');
                  const manifest = require(
                      `${process.env.RUNNER_TEMP}/release-artifacts/candidate-manifest.json`
                  );
                  fs.writeFileSync(process.argv[2], JSON.stringify({
                      name: 'v3-promotion-signature-audit',
                      private: true,
                      version: '0.0.0',
                      dependencies: Object.fromEntries(
                          manifest.packages.map(pkg => [pkg.name, manifest.version])
                      ),
                  }));
                  NODE
                  npm install --prefix "$AUDIT_ROOT" --package-lock-only \
                      --ignore-scripts --registry=https://registry.npmjs.org
                  npm audit signatures --prefix "$AUDIT_ROOT"

            - name: Verify frozen main and compute exact four-ref plan
              env:
                  CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
                  EXPECTED_A_SHA: ${{ inputs.expected_release_order_a_sha }}
                  EXPECTED_B_SHA: ${{ inputs.expected_release_order_b_sha }}
                  EXPECTED_C_SHA: ${{ inputs.expected_release_order_c_sha }}
                  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
                  SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
              run: |
                  set -eu
                  test "$EXPECTED_MAIN_SHA" = "$SOURCE_SHA"
                  for BRANCH in main v3-release-order-a \
                      v3-release-order-b v3-release-order-c; do
                      git fetch --no-tags origin \
                          "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
                  done
                  MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main |
                      awk 'NR == 1 {print $1}')"
                  A_SHA="$(git ls-remote --exit-code origin \
                      refs/heads/v3-release-order-a | awk 'NR == 1 {print $1}')"
                  B_SHA="$(git ls-remote --exit-code origin \
                      refs/heads/v3-release-order-b | awk 'NR == 1 {print $1}')"
                  C_SHA="$(git ls-remote --exit-code origin \
                      refs/heads/v3-release-order-c | awk 'NR == 1 {print $1}')"
                  MAIN_SHA="$MAIN_SHA" A_SHA="$A_SHA" B_SHA="$B_SHA" C_SHA="$C_SHA" \
                      node - <<'NODE'
                  const fs = require('node:fs');
                  const {execFileSync} = require('node:child_process');
                  const {createStep3Execution} =
                      require('./scripts/release/promotion');
                  const destinations = [
                      ['main', 'MAIN'],
                      ['v3-release-order-a', 'A'],
                      ['v3-release-order-b', 'B'],
                      ['v3-release-order-c', 'C'],
                  ].map(([branch, key]) => ({
                      branch,
                      currentSha: process.env[`${key}_SHA`],
                      expectedSha: process.env[`EXPECTED_${key}_SHA`],
                  }));
                  const execution = createStep3Execution({
                      candidateSha: process.env.CANDIDATE_SHA,
                      destinations,
                      isAncestor: (oldSha, newSha) => {
                          try {
                              execFileSync(
                                  'git',
                                  ['merge-base', '--is-ancestor', oldSha, newSha]
                              );
                              return true;
                          } catch {
                              return false;
                          }
                      },
                      sourceSha: process.env.SOURCE_SHA,
                  });
                  fs.writeFileSync(
                      `${process.env.RUNNER_TEMP}/promotion-plan.json`,
                      JSON.stringify(execution)
                  );
                  NODE

            - name: Fresh atomic push or converged recovery no-op
              env:
                  CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
              run: |
                  node scripts/release/promotion.js push-plan \
                      --candidate-sha "$CANDIDATE_SHA" \
                      --plan "$RUNNER_TEMP/promotion-plan.json" \
                      --atomic true

            - name: Require downstream exact served-artifact validation
              env:
                  CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
                  DOWNSTREAM_ENDPOINT: ${{ secrets.downstream_validation_endpoint }}
                  DOWNSTREAM_TOKEN: ${{ secrets.downstream_validation_token }}
                  MANIFEST_SHA256: ${{ steps.identity.outputs.manifest_sha256 }}
                  SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
                  VERSION: ${{ steps.identity.outputs.version }}
                  CYCLE_DEPLOYMENT_ID: ${{ inputs.cycle_deployment_id }}
                  CYCLE_ID: ${{ inputs.cycle_id }}
              run: |
                  node scripts/release/promotion.js request-downstream \
                      --endpoint "$DOWNSTREAM_ENDPOINT" \
                      --token "$DOWNSTREAM_TOKEN" \
                      --candidate-sha "$CANDIDATE_SHA" \
                      --manifest-sha256 "$MANIFEST_SHA256" \
                      --source-sha "$SOURCE_SHA" \
                      --version "$VERSION"

            - name: Append promoted only after downstream validation
              env:
                  CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
                  DEPLOYMENT_ID: ${{ inputs.lifecycle_deployment_id }}
                  GH_TOKEN: ${{ github.token }}
                  MANIFEST_SHA256: ${{ steps.identity.outputs.manifest_sha256 }}
                  VERSION: ${{ steps.identity.outputs.version }}
              run: |
                  set -eu
                  gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}" \
                      > "$RUNNER_TEMP/lifecycle-deployment.json"
                  gh api --paginate --slurp \
                      "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses?per_page=100" \
                      > "$RUNNER_TEMP/lifecycle-statuses.json"
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const {appendLifecycleStatus} =
                      require('./scripts/release/lifecycle-record');
                  appendLifecycleStatus({
                      candidateSha: process.env.CANDIDATE_SHA,
                      cycleDeploymentId: Number(process.env.CYCLE_DEPLOYMENT_ID),
                      cycleId: process.env.CYCLE_ID,
                      deployment: JSON.parse(fs.readFileSync(
                          `${process.env.RUNNER_TEMP}/lifecycle-deployment.json`,
                          'utf8'
                      )),
                      manifestSha256: process.env.MANIFEST_SHA256,
                      repository: process.env.GITHUB_REPOSITORY,
                      state: 'promoted',
                      statuses: JSON.parse(fs.readFileSync(
                          `${process.env.RUNNER_TEMP}/lifecycle-statuses.json`,
                          'utf8'
                      )),
                      version: process.env.VERSION,
                  });
                  NODE

            - name: Complete durable cycle after candidate promotion
              env:
                  CYCLE_DEPLOYMENT_ID: ${{ inputs.cycle_deployment_id }}
                  CYCLE_ID: ${{ inputs.cycle_id }}
                  GH_TOKEN: ${{ github.token }}
                  SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
                  VERSION: ${{ steps.identity.outputs.version }}
              run: |
                  set -eu
                  gh api \
                      "repos/${GITHUB_REPOSITORY}/deployments/${CYCLE_DEPLOYMENT_ID}" \
                      > "$RUNNER_TEMP/release-cycle.json"
                  gh api --paginate --slurp \
                      "repos/${GITHUB_REPOSITORY}/deployments/${CYCLE_DEPLOYMENT_ID}/statuses?per_page=100" \
                      > "$RUNNER_TEMP/release-cycle-statuses.json"
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const {
                      completeCycle,
                      validateCycleDeployment,
                  } = require('./scripts/release/release-cycle');
                  const deployment = JSON.parse(fs.readFileSync(
                      `${process.env.RUNNER_TEMP}/release-cycle.json`
                  ));
                  const statuses = JSON.parse(fs.readFileSync(
                      `${process.env.RUNNER_TEMP}/release-cycle-statuses.json`
                  ));
                  const identity = validateCycleDeployment({
                      deployment,
                      cycleDeploymentId: Number(process.env.CYCLE_DEPLOYMENT_ID),
                      expectedCycleId: process.env.CYCLE_ID,
                      intentPullNumber: deployment.payload.intent_pull_number,
                      repository: process.env.GITHUB_REPOSITORY,
                      sourceSha: deployment.payload.source_sha,
                      statuses,
                      version: process.env.VERSION,
                  });
                  if (
                      identity.cycleId !== process.env.CYCLE_ID ||
                      identity.deploymentId !==
                          Number(process.env.CYCLE_DEPLOYMENT_ID) ||
                      identity.effectiveSourceSha !== process.env.SOURCE_SHA
                  ) {
                      throw new Error('Step 3 release-cycle identity mismatch');
                  }
                  completeCycle({deployment, statuses});
                  NODE
