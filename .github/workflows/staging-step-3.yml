name: 'Staging Release - Step 3: Release to CDN and Synchronize Branches'
run-name: 'Staging Release - Step 3 [${{ inputs.releaseTag }}]'

on:
    workflow_dispatch:
        inputs:
            releaseTag: {description: Stable release tag, required: true, type: string}
            dryRun: {description: Do a dry run to validate without pushing, required: true, type: boolean, default: true}

concurrency:
    group: ${{ startsWith(inputs.releaseTag, 'v2.') && format('mparticle-web-sdk-v2-step-3-run-{0}', github.run_id) || format('mparticle-web-sdk-v3-release-{0}', inputs.releaseTag) }}
    cancel-in-progress: false

jobs:
    resolve-v3:
        if: ${{ !startsWith(inputs.releaseTag, 'v2.') }}
        runs-on: ubuntu-latest
        permissions: {contents: read}
        outputs:
            cycle_deployment_id: ${{ steps.resolve.outputs.cycle_deployment_id }}
            cycle_id: ${{ steps.resolve.outputs.cycle_id }}
            lifecycle_deployment_id: ${{ steps.resolve.outputs.deployment_id }}
            main_sha: ${{ steps.refs.outputs.main_sha }}
            a_sha: ${{ steps.refs.outputs.a_sha }}
            b_sha: ${{ steps.refs.outputs.b_sha }}
            c_sha: ${{ steps.refs.outputs.c_sha }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with: {ref: '${{ github.sha }}'}
            - id: resolve
              env:
                  ACTIVATION_ENABLED: ${{ vars.V3_RELEASE_ACTIVATED }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.releaseTag }}
              run: |
                  set -eu
                  test "$GITHUB_REPOSITORY" = mParticle/mparticle-web-sdk
                  test "$GITHUB_REPOSITORY_OWNER" = mParticle
                  test "$ACTIVATION_ENABLED" = true
                  test "$GITHUB_EVENT_NAME" = workflow_dispatch
                  test "$GITHUB_REF" = refs/heads/main
                  test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/staging-step-3.yml@refs/heads/main"
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                  test "$(git ls-remote --exit-code origin refs/heads/main |
                      awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
                  mkdir "$RUNNER_TEMP/records"
                  gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/records" --pattern release-envelope.json --pattern candidate-manifest.json
                  node scripts/release/promotion.js resolve --record-directory "$RUNNER_TEMP/records" --tag "$RELEASE_TAG"
            - id: refs
              run: |
                  set -eu
                  for pair in main:main_sha v3-release-order-a:a_sha v3-release-order-b:b_sha v3-release-order-c:c_sha; do
                      branch="${pair%%:*}"; name="${pair#*:}"
                      echo "$name=$(git ls-remote --exit-code origin refs/heads/${branch} | awk 'NR == 1 {print $1}')" >> "$GITHUB_OUTPUT"
                  done

    v2:
        if: startsWith(inputs.releaseTag, 'v2.')
        uses: ./.github/workflows/reusable-v2-staging-step-3.yml
        permissions: {contents: write}
        with:
            releaseTag: ${{ inputs.releaseTag }}
            dryRun: ${{ inputs.dryRun }}
        secrets:
            MP_SEMANTIC_RELEASE_BOT: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}

    v3:
        if: ${{ !startsWith(inputs.releaseTag, 'v2.') && needs.resolve-v3.result == 'success' && inputs.dryRun == false }}
        needs: resolve-v3
        uses: ./.github/workflows/reusable-v3-staging-step-3.yml
        permissions:
            actions: read
            attestations: read
            contents: write
            deployments: write
        with:
            cycle_deployment_id: ${{ fromJSON(needs.resolve-v3.outputs.cycle_deployment_id) }}
            cycle_id: ${{ needs.resolve-v3.outputs.cycle_id }}
            expected_main_sha: ${{ needs.resolve-v3.outputs.main_sha }}
            expected_release_order_a_sha: ${{ needs.resolve-v3.outputs.a_sha }}
            expected_release_order_b_sha: ${{ needs.resolve-v3.outputs.b_sha }}
            expected_release_order_c_sha: ${{ needs.resolve-v3.outputs.c_sha }}
            lifecycle_deployment_id: ${{ fromJSON(needs.resolve-v3.outputs.lifecycle_deployment_id) }}
            release_tag: ${{ inputs.releaseTag }}
        secrets:
            downstream_validation_endpoint: ${{ secrets.V3_DOWNSTREAM_VALIDATION_ENDPOINT }}
            downstream_validation_token: ${{ secrets.V3_DOWNSTREAM_VALIDATION_TOKEN }}

    reject-v3-dry-run:
        if: ${{ !startsWith(inputs.releaseTag, 'v2.') && inputs.dryRun }}
        runs-on: ubuntu-latest
        steps:
            - run: echo 'V3 Step 3 requires dryRun=false.' >&2; exit 1
