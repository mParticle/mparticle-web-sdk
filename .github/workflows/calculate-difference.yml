name: Calculate Percent Difference

on:
    workflow_call:
        inputs:
            initial_bundle_size:
                description: Initial Bundle Size
                type: string
                required: true
            updated_bundle_size:
                description: Updated Bundle Size
                type: string
                required: true
        outputs:
            diff:
                description: Difference as a number
                value: ${{ jobs.calculate-diff.outputs.diff }}
            diff_percent:
                description: Difference as a percentage
                value: ${{ jobs.calculate-diff.outputs.diff_percent }}

jobs:
    calculate-diff:
        name: Calculate Bundle Size Difference
        runs-on: ubuntu-latest
        outputs:
            diff: ${{ steps.report-diff.outputs.diff }}
            diff_percent: ${{ steps.report-diff.outputs.diff_percent }}
        steps:
            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - name: Output Sizes
              env:
                  INITIAL_BUNDLE_SIZE: ${{ inputs.initial_bundle_size }}
                  UPDATED_BUNDLE_SIZE: ${{ inputs.updated_bundle_size }}
              run: |
                  echo "Initial Size: $INITIAL_BUNDLE_SIZE"
                  echo "Updated Size: $UPDATED_BUNDLE_SIZE"

            - name: Report Diff
              id: report-diff
              env:
                  INITIAL_BUNDLE_SIZE: ${{ inputs.initial_bundle_size }}
                  UPDATED_BUNDLE_SIZE: ${{ inputs.updated_bundle_size }}
              run: |
                  node -e '
                      // Number("") is 0, so an empty size is read as NaN instead.
                      const readSize = name => {
                          const value = (process.env[name] || "").trim();
                          return value === "" ? NaN : Number(value);
                      };
                      const initial = readSize("INITIAL_BUNDLE_SIZE");
                      const updated = readSize("UPDATED_BUNDLE_SIZE");
                      if (!(initial > 0) || !Number.isFinite(updated)) {
                          console.error("Bundle sizes must be numbers, and the initial size must be positive");
                          process.exit(1);
                      }
                      const diff = ((updated - initial) * 100) / initial;
                      // Floor to 2 decimals; toPrecision drops float noise
                      // so 1.25 is not floored to 1.24.
                      const diffPercent =
                          Math.floor(Number((diff * 100).toPrecision(12))) / 100;
                      require("fs").appendFileSync(
                          process.env.GITHUB_OUTPUT,
                          "diff=" + diff + "\ndiff_percent=" + diffPercent + "\n"
                      );
                  '

            - name: Output Percent Change
              env:
                  DIFF_PERCENT: ${{ steps.report-diff.outputs.diff_percent }}
              run: echo "$DIFF_PERCENT % Difference"
