name: 'V3 shadow release: upload candidate'

# Uploads a V3 release candidate into the artifact buckets and points the
# v3-staging channel at it.
#
# In release-gate mode (workflow_dispatch with release_gate=true, dispatched by
# v3-release-step-1.yml after its package and kit publish jobs succeed), this
# workflow requires npm parity to pass (reading npm again with
# backoff for up to 10 minutes while a package reads pending or unavailable),
# accepts an in-progress or already-completed (uncancelled)
# v3-release-step-1.yml run once Perform Release and Package V3 candidate
# (shadow) have succeeded and uploaded one unexpired candidate artifact,
# requires V3_SHADOW_PODS to include
# every production pod (us1, us2, st1, eu1 and au1; qa is optional and blocks
# the release only when listed in V3_SHADOW_PODS), and fails closed if any
# check, upload or stage is skipped or fails. Stage moves each pod's v3-staging
# pointer independently, so if one pod fails, the others have already moved and
# a re-run repairs the failed pod.
#
# During the V2/V3 workflow split transition, workflow_run still mirrors the
# shared "Staging Release - Step 1: Prepare CDN Pre-Release, Publish NPM" on
# v3-staging without delaying or failing it, and a manual workflow_dispatch
# with release_gate=false re-mirrors any completed Step 1 run whose candidate
# artifact is still kept (7 days). After a re-run of failed jobs, the candidate
# is the one made by the package job the re-run kept.
#
# workflow_run always runs this file and its scripts from the default branch,
# never code from the release run. The release run and its artifact are
# untrusted input: the run must be a workflow_dispatch of v3-release-step-1.yml
# or staging-step-1.yml in this repository from v3-staging (or a strict v3.X.Y
# tag while V3_RELEASE_PLEASE_ENABLED is true), with that file's
# V3 run title, and the candidate is validated and compared with the release
# tag before any credential is issued.
#
# Credentials are used only in the two called workflows, each the sole job in
# its Environment (v3-shadow-upload-job.yml in v3-candidate-upload and
# v3-shadow-pointer-job.yml in v3-release-promote). Each pod's roles trust:
#   uploader  sub               repo:mParticle/mparticle-web-sdk:environment:v3-candidate-upload
#             job_workflow_ref  mParticle/mparticle-web-sdk/.github/workflows/v3-shadow-upload-job.yml@refs/heads/main
#   promoter  sub               repo:mParticle/mparticle-web-sdk:environment:v3-release-promote
#             job_workflow_ref  mParticle/mparticle-web-sdk/.github/workflows/v3-shadow-pointer-job.yml@refs/heads/main
#   both      aud sts.amazonaws.com, and this repository's repository_id and
#             repository_owner_id
#
# Configuration (repository variable, Environment secrets):
#   V3_SHADOW_PODS  comma-separated pods to mirror, for example qa; unset
#                   disables the workflow
#   v3-candidate-upload and v3-release-promote Environments, each limited to
#   the default branch, hold per-pod AWS_ROLE_ARN_<POD>, AWS_REGION_<POD>,
#   AWS_ACCOUNT_ID_<POD> and SDK_ARTIFACT_BUCKET_<POD>. A called job sees
#   an Environment secret only if its caller passes that name, so each
#   caller job lists them all by name; none uses secrets: inherit.

on:
    workflow_run: # zizmor: ignore[dangerous-triggers] -- see the header; no code or ref from the triggering run is executed or checked out
        workflows:
            - 'Staging Release - Step 1: Prepare CDN Pre-Release, Publish NPM'
        types:
            - completed
        branches:
            - v3-staging
    workflow_dispatch:
        inputs:
            step1_run_id:
                description: Step 1 run ID to mirror again (its candidate artifact is kept for 7 days)
                required: true
                type: string
            release_gate:
                description: Fail closed as the V3 Step 1 release gate (requires every production pod)
                required: true
                type: boolean
                default: false
            release_tag:
                description: Expected release tag (v3.X.Y) for a tag-origin recovery run
                required: false
                type: string
                default: ''

permissions: {}

# Release-gate runs for one Step 1 run share a group keyed on step1_run_id
# alone, so a re-run's child queues behind a leftover child (one whose cancel
# never got through, or whose dispatch reply was lost) instead of staging the
# same build in parallel with it. A transition workflow_run or a dispatch with
# release_gate=false never shares that group, so it cannot displace a pending
# gate run.
concurrency:
    group: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && format('v3-shadow-candidate-gate-{0}', inputs.step1_run_id) || 'v3-shadow-candidate' }}
    cancel-in-progress: false

jobs:
    # No Environment and no cloud identity: an ineligible run stops here.
    resolve:
        name: Resolve the Step 1 run
        if: ${{ github.repository == 'mParticle/mparticle-web-sdk' && (inputs.release_gate || vars.V3_SHADOW_PODS != '') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: read # Read the Step 1 run and list its artifacts.
            contents: read
        outputs:
            found: ${{ steps.artifact.outputs.found }}
            run_id: ${{ steps.run.outputs.run_id }}
            build_id: ${{ steps.run.outputs.build_id }}
            artifact_name: ${{ steps.run.outputs.artifact_name }}
            release_tag: ${{ steps.run.outputs.release_tag }}
            pods: ${{ steps.pods.outputs.pods }}
        steps:
            - name: Checkout the default branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 1
                  ref: ${{ github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.19.0
                  package-manager-cache: false

            - name: Require the default branch definition
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -eu
                  if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
                      echo 'Shadow release workflows run only from the default branch.'
                      exit 1
                  fi

            - name: Validate the Step 1 run
              id: run
              env:
                  GH_TOKEN: ${{ github.token }}
                  STEP1_RUN_ID: ${{ inputs.step1_run_id }}
                  RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && 'true' || 'false' }}
                  RELEASE_PLEASE_ENABLED: ${{ vars.V3_RELEASE_PLEASE_ENABLED }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  set -euo pipefail
                  case "${RELEASE_GATE:-false}" in
                      true|false) ;;
                      *) exit 1 ;;
                  esac
                  RELEASE_PLEASE_MODE=false
                  if [ "${RELEASE_PLEASE_ENABLED:-}" = 'true' ]; then
                      RELEASE_PLEASE_MODE=true
                  fi
                  RUN_FILE="$RUNNER_TEMP/step1-run.json"
                  if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
                      jq '.workflow_run' "$GITHUB_EVENT_PATH" > "$RUN_FILE"
                  else
                      if [[ ! "$STEP1_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
                          echo 'step1_run_id must be a workflow run ID.'
                          exit 1
                      fi
                      gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STEP1_RUN_ID}" > "$RUN_FILE"
                  fi
                  WORKFLOW_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-step-1.yml" --jq .id)"
                  V3_WORKFLOW_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v3-release-step-1.yml" --jq .id)"
                  RUN_ID="$(jq -r .id "$RUN_FILE")"
                  RUN_ATTEMPT="$(jq -r .run_attempt "$RUN_FILE")"
                  if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || [[ ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]; then
                      echo 'The Step 1 run has an invalid ID or attempt.'
                      exit 1
                  fi
                  # The attempt's jobs show whether a failed run failed only at
                  # kits, and when its package job ran; a re-run of failed jobs
                  # keeps an earlier attempt's candidate, made in that window.
                  ARTIFACTS_FILE="$RUNNER_TEMP/step1-artifacts.json"
                  gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" |
                      jq -s '[.[].artifacts[]]' > "$ARTIFACTS_FILE"
                  JOBS_FILE="$RUNNER_TEMP/step1-jobs.json"
                  gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" |
                      jq -s '[.[].jobs[]]' > "$JOBS_FILE"
                  set -- \
                      --run "$RUN_FILE" \
                      --repository "$GITHUB_REPOSITORY" \
                      --workflow-id "$WORKFLOW_ID" \
                      --v3-workflow-id "$V3_WORKFLOW_ID" \
                      --trigger "$GITHUB_EVENT_NAME" \
                      --release-gate "${RELEASE_GATE:-false}" \
                      --release-please-mode "$RELEASE_PLEASE_MODE" \
                      --artifacts "$ARTIFACTS_FILE" \
                      --jobs "$JOBS_FILE"
                  if [ -n "${RELEASE_TAG:-}" ]; then
                      set -- "$@" --release-tag "$RELEASE_TAG"
                  fi
                  node --experimental-strip-types scripts/v3-release/shadow-release-trigger.ts step1 \
                      "$@" | tee -a "$GITHUB_OUTPUT" > "$RUNNER_TEMP/step1-plan.txt"
                  cat "$RUNNER_TEMP/step1-plan.txt"
                  if grep -qx 'skip=true' "$RUNNER_TEMP/step1-plan.txt"; then
                      if [ "${RELEASE_GATE:-false}" = 'true' ]; then
                          echo 'Release-gate mode does not allow skipping the Step 1 run.'
                          exit 1
                      fi
                      echo "::notice::$(sed -n 's/^reason=//p' "$RUNNER_TEMP/step1-plan.txt"); nothing to mirror."
                  fi

            - name: Find the shadow candidate
              id: artifact
              if: ${{ steps.run.outputs.skip == 'false' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ steps.run.outputs.run_id }}
                  ARTIFACT_NAME: ${{ steps.run.outputs.artifact_name }}
                  RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && 'true' || 'false' }}
              run: |
                  set -euo pipefail
                  COUNT="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" |
                      jq -s --arg name "$ARTIFACT_NAME" \
                          '[.[].artifacts[] | select(.name == $name and (.expired | not))] | length')"
                  if [ "$COUNT" = '1' ]; then
                      echo 'found=true' >> "$GITHUB_OUTPUT"
                  elif [ "${RELEASE_GATE:-false}" = 'true' ]; then
                      echo 'Release-gate mode requires exactly one unexpired shadow candidate artifact.'
                      exit 1
                  else
                      echo 'found=false' >> "$GITHUB_OUTPUT"
                      echo "::notice::No shadow candidate on this Step 1 run (dry run, V2, recovery, or packaging disabled or failed); nothing to mirror."
                  fi

            - name: Select pods
              id: pods
              env:
                  POD_LIST: ${{ vars.V3_SHADOW_PODS }}
                  RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && 'true' || 'false' }}
              run: |
                  set -euo pipefail
                  node --experimental-strip-types scripts/v3-release/shadow-release-trigger.ts pods \
                      --list "$POD_LIST" \
                      --release-gate "${RELEASE_GATE:-false}" | tee -a "$GITHUB_OUTPUT"

    # Still no cloud identity: the candidate must be the release before any
    # credential is issued.
    verify:
        name: Check the candidate against the release
        needs: resolve
        if: ${{ needs.resolve.outputs.found == 'true' }}
        runs-on: ubuntu-24.04
        # The release-gate npm parity reads end within 12 minutes (the
        # 10-minute window and a last read of at most 2 minutes), which leaves
        # 13 minutes for the other checks.
        timeout-minutes: 25
        permissions:
            actions: read # Download the artifact of the Step 1 run.
            contents: read
        outputs:
            version: ${{ steps.candidate.outputs.version }}
            release_tag: ${{ steps.candidate.outputs.release_tag }}
            source_sha: ${{ steps.candidate.outputs.source_sha }}
            metadata_sha256: ${{ steps.candidate.outputs.metadata_sha256 }}
            git_parity: ${{ steps.parity.outputs.git_parity }}
            npm_parity: ${{ steps.parity.outputs.npm_parity }}
        steps:
            - name: Checkout the default branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 1
                  ref: ${{ github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.19.0
                  package-manager-cache: false

            - name: Download the candidate from the Step 1 run
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.resolve.outputs.artifact_name }}
                  run-id: ${{ needs.resolve.outputs.run_id }}
                  github-token: ${{ github.token }}
                  path: ${{ runner.temp }}/v3-candidate

            - name: Validate the candidate
              id: candidate
              env:
                  BUILD_ID: ${{ needs.resolve.outputs.build_id }}
                  EXPECTED_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
              run: |
                  set -euo pipefail
                  CANDIDATE="$RUNNER_TEMP/v3-candidate"
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$CANDIDATE" \
                      --expected-build-id "$BUILD_ID" \
                      --dry-run > "$RUNNER_TEMP/v3-candidate-plan.txt"
                  VERSION="$(jq -r .version "$CANDIDATE/metadata.json")"
                  SOURCE_SHA="$(jq -r .sourceSha "$CANDIDATE/metadata.json")"
                  if [[ ! "$VERSION" =~ ^3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo 'The candidate is not a stable V3 release.'
                      exit 1
                  fi
                  RELEASE_TAG="v${VERSION}"
                  if [ -n "${EXPECTED_RELEASE_TAG:-}" ] && [ "$RELEASE_TAG" != "$EXPECTED_RELEASE_TAG" ]; then
                      echo "The candidate release_tag (${RELEASE_TAG}) must equal the Step 1 run head_branch (${EXPECTED_RELEASE_TAG})."
                      exit 1
                  fi
                  {
                      echo "version=${VERSION}"
                      echo "release_tag=${RELEASE_TAG}"
                      echo "source_sha=${SOURCE_SHA}"
                      echo "metadata_sha256=$(sha256sum "$CANDIDATE/metadata.json" | cut -d ' ' -f 1)"
                  } >> "$GITHUB_OUTPUT"
                  tail -n 4 "$RUNNER_TEMP/v3-candidate-plan.txt"

            # The reader-contract checker shares no code with the packager or
            # the uploader, so a bug in either cannot also hide itself here.
            - name: Check the candidate independently
              env:
                  VERSION: ${{ steps.candidate.outputs.version }}
                  BUILD_ID: ${{ needs.resolve.outputs.build_id }}
              run: |
                  set -eu
                  node --experimental-strip-types scripts/check-v3-candidate.ts \
                      "$RUNNER_TEMP/v3-candidate" \
                      --version "$VERSION" \
                      --build-id "$BUILD_ID"

            - name: Fetch the release tag
              env:
                  RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
              run: |
                  set -eu
                  git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

            # npm can take minutes to show a version it has accepted, so in
            # release-gate mode a pending or unavailable npm read is read again
            # with a doubling backoff for up to 10 minutes, and a fail reading
            # stops at once. Each npm view gets at most 30 seconds and each
            # read of every package at most 2 minutes, so the reads always end
            # with a parity result inside the job timeout. A transition
            # workflow_run (or a dispatch with release_gate=false) reads npm
            # once, as before.
            - name: Check parity with git and npm
              id: parity
              env:
                  RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
                  NPM_RETRY_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && '600' || '0' }}
              run: |
                  node --experimental-strip-types scripts/v3-release/check-release-parity.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --tag "$RELEASE_TAG" \
                      --npm \
                      --npm-retry-seconds "$NPM_RETRY_SECONDS" \
                      --report "$RUNNER_TEMP/v3-parity.json" \
                      --summary "$GITHUB_STEP_SUMMARY" \
                      --github-output "$GITHUB_OUTPUT"

            # Step 1 dispatches a release-gate run only after its kits are
            # published, and the parity check above has read npm
            # again for up to 10 minutes, so every package must now be on npm
            # with the candidate's integrity. A read still pending (not yet
            # published) or unavailable fails the gate instead of uploading.
            - name: Require npm parity in release-gate mode
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
              env:
                  NPM_PARITY: ${{ steps.parity.outputs.npm_parity }}
              run: |
                  set -eu
                  if [ "${NPM_PARITY:-}" != 'pass' ]; then
                      echo "Release-gate mode requires npm parity to pass (got ${NPM_PARITY:-none})."
                      exit 1
                  fi

    upload:
        name: Upload
        needs: [resolve, verify]
        if: ${{ needs.verify.outputs.git_parity == 'pass' && (needs.verify.outputs.npm_parity == 'pass' || (!(github.event_name == 'workflow_dispatch' && inputs.release_gate) && needs.verify.outputs.npm_parity != 'fail')) }}
        # The ceiling for the called job, which alone declares an Environment.
        permissions:
            actions: read # Download the artifact of the Step 1 run.
            contents: read
            id-token: write # Exchange OIDC for AWS credentials in the called job.
        uses: ./.github/workflows/v3-shadow-upload-job.yml # zizmor: ignore[self-repository] -- the AWS roles pin job_workflow_ref, documented for ./ calls
        with:
            run_id: ${{ needs.resolve.outputs.run_id }}
            artifact_name: ${{ needs.resolve.outputs.artifact_name }}
            build_id: ${{ needs.resolve.outputs.build_id }}
            version: ${{ needs.verify.outputs.version }}
            metadata_sha256: ${{ needs.verify.outputs.metadata_sha256 }}
            source_sha: ${{ needs.verify.outputs.source_sha }}
            pods: ${{ needs.resolve.outputs.pods }}
        # Named, not inherited: the called job's Environment supplies the values.
        secrets:
            AWS_ROLE_ARN_QA: ${{ secrets.AWS_ROLE_ARN_QA }}
            AWS_REGION_QA: ${{ secrets.AWS_REGION_QA }}
            AWS_ACCOUNT_ID_QA: ${{ secrets.AWS_ACCOUNT_ID_QA }}
            SDK_ARTIFACT_BUCKET_QA: ${{ secrets.SDK_ARTIFACT_BUCKET_QA }}
            AWS_ROLE_ARN_US1: ${{ secrets.AWS_ROLE_ARN_US1 }}
            AWS_REGION_US1: ${{ secrets.AWS_REGION_US1 }}
            AWS_ACCOUNT_ID_US1: ${{ secrets.AWS_ACCOUNT_ID_US1 }}
            SDK_ARTIFACT_BUCKET_US1: ${{ secrets.SDK_ARTIFACT_BUCKET_US1 }}
            AWS_ROLE_ARN_US2: ${{ secrets.AWS_ROLE_ARN_US2 }}
            AWS_REGION_US2: ${{ secrets.AWS_REGION_US2 }}
            AWS_ACCOUNT_ID_US2: ${{ secrets.AWS_ACCOUNT_ID_US2 }}
            SDK_ARTIFACT_BUCKET_US2: ${{ secrets.SDK_ARTIFACT_BUCKET_US2 }}
            AWS_ROLE_ARN_ST1: ${{ secrets.AWS_ROLE_ARN_ST1 }}
            AWS_REGION_ST1: ${{ secrets.AWS_REGION_ST1 }}
            AWS_ACCOUNT_ID_ST1: ${{ secrets.AWS_ACCOUNT_ID_ST1 }}
            SDK_ARTIFACT_BUCKET_ST1: ${{ secrets.SDK_ARTIFACT_BUCKET_ST1 }}
            AWS_ROLE_ARN_EU1: ${{ secrets.AWS_ROLE_ARN_EU1 }}
            AWS_REGION_EU1: ${{ secrets.AWS_REGION_EU1 }}
            AWS_ACCOUNT_ID_EU1: ${{ secrets.AWS_ACCOUNT_ID_EU1 }}
            SDK_ARTIFACT_BUCKET_EU1: ${{ secrets.SDK_ARTIFACT_BUCKET_EU1 }}
            AWS_ROLE_ARN_AU1: ${{ secrets.AWS_ROLE_ARN_AU1 }}
            AWS_REGION_AU1: ${{ secrets.AWS_REGION_AU1 }}
            AWS_ACCOUNT_ID_AU1: ${{ secrets.AWS_ACCOUNT_ID_AU1 }}
            SDK_ARTIFACT_BUCKET_AU1: ${{ secrets.SDK_ARTIFACT_BUCKET_AU1 }}

    # Mirrors the v3-staging branch move. The pointer job skips it when
    # v3-staging has already moved past this release, and the promoter
    # refuses to move v3-staging to an older version.
    stage:
        name: Stage
        needs: [resolve, verify, upload]
        # The ceiling for the called job, which alone declares an Environment.
        permissions:
            contents: read
            id-token: write # Exchange OIDC for AWS credentials in the called job.
        uses: ./.github/workflows/v3-shadow-pointer-job.yml # zizmor: ignore[self-repository] -- the AWS roles pin job_workflow_ref, documented for ./ calls
        with:
            operation: stage
            version: ${{ needs.verify.outputs.version }}
            build_id: ${{ needs.resolve.outputs.build_id }}
            expected_metadata_sha256: ${{ needs.verify.outputs.metadata_sha256 }}
            release_tag: ${{ needs.verify.outputs.release_tag }}
            branches: v3-staging
            pods: ${{ needs.resolve.outputs.pods }}
            dry_run: false
            release_gate: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        # Named, not inherited: the called job's Environment supplies the values.
        secrets:
            AWS_ROLE_ARN_QA: ${{ secrets.AWS_ROLE_ARN_QA }}
            AWS_REGION_QA: ${{ secrets.AWS_REGION_QA }}
            AWS_ACCOUNT_ID_QA: ${{ secrets.AWS_ACCOUNT_ID_QA }}
            SDK_ARTIFACT_BUCKET_QA: ${{ secrets.SDK_ARTIFACT_BUCKET_QA }}
            AWS_ROLE_ARN_US1: ${{ secrets.AWS_ROLE_ARN_US1 }}
            AWS_REGION_US1: ${{ secrets.AWS_REGION_US1 }}
            AWS_ACCOUNT_ID_US1: ${{ secrets.AWS_ACCOUNT_ID_US1 }}
            SDK_ARTIFACT_BUCKET_US1: ${{ secrets.SDK_ARTIFACT_BUCKET_US1 }}
            AWS_ROLE_ARN_US2: ${{ secrets.AWS_ROLE_ARN_US2 }}
            AWS_REGION_US2: ${{ secrets.AWS_REGION_US2 }}
            AWS_ACCOUNT_ID_US2: ${{ secrets.AWS_ACCOUNT_ID_US2 }}
            SDK_ARTIFACT_BUCKET_US2: ${{ secrets.SDK_ARTIFACT_BUCKET_US2 }}
            AWS_ROLE_ARN_ST1: ${{ secrets.AWS_ROLE_ARN_ST1 }}
            AWS_REGION_ST1: ${{ secrets.AWS_REGION_ST1 }}
            AWS_ACCOUNT_ID_ST1: ${{ secrets.AWS_ACCOUNT_ID_ST1 }}
            SDK_ARTIFACT_BUCKET_ST1: ${{ secrets.SDK_ARTIFACT_BUCKET_ST1 }}
            AWS_ROLE_ARN_EU1: ${{ secrets.AWS_ROLE_ARN_EU1 }}
            AWS_REGION_EU1: ${{ secrets.AWS_REGION_EU1 }}
            AWS_ACCOUNT_ID_EU1: ${{ secrets.AWS_ACCOUNT_ID_EU1 }}
            SDK_ARTIFACT_BUCKET_EU1: ${{ secrets.SDK_ARTIFACT_BUCKET_EU1 }}
            AWS_ROLE_ARN_AU1: ${{ secrets.AWS_ROLE_ARN_AU1 }}
            AWS_REGION_AU1: ${{ secrets.AWS_REGION_AU1 }}
            AWS_ACCOUNT_ID_AU1: ${{ secrets.AWS_ACCOUNT_ID_AU1 }}
            SDK_ARTIFACT_BUCKET_AU1: ${{ secrets.SDK_ARTIFACT_BUCKET_AU1 }}

    # In release-gate mode, a skipped verify, upload or stage must fail the run
    # rather than concluding as a successful no-op.
    release-gate:
        name: Require upload and stage
        needs: [resolve, verify, upload, stage]
        if: >-
            ${{
                always() &&
                !cancelled() &&
                github.repository == 'mParticle/mparticle-web-sdk' &&
                github.event_name == 'workflow_dispatch' &&
                inputs.release_gate
            }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Require every release-gate job to succeed
              env:
                  RESOLVE_RESULT: ${{ needs.resolve.result }}
                  VERIFY_RESULT: ${{ needs.verify.result }}
                  UPLOAD_RESULT: ${{ needs.upload.result }}
                  STAGE_RESULT: ${{ needs.stage.result }}
              run: |
                  set -eu
                  if [ "$RESOLVE_RESULT" != 'success' ] ||
                      [ "$VERIFY_RESULT" != 'success' ] ||
                      [ "$UPLOAD_RESULT" != 'success' ] ||
                      [ "$STAGE_RESULT" != 'success' ]; then
                      echo "Release-gate candidate run requires resolve, verify, upload and stage to succeed (got resolve=${RESOLVE_RESULT}, verify=${VERIFY_RESULT}, upload=${UPLOAD_RESULT}, stage=${STAGE_RESULT})."
                      exit 1
                  fi
