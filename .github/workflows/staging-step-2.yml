name: 'Staging Release - Step 2: Publish SDK Release to Release Order Branch'
run-name: 'Staging Release - Step 2 [${{ inputs.releaseTag }} → ${{ inputs.releaseOrderBranch }}]'

on:
    workflow_dispatch:
        inputs:
            releaseTag:
                description: Stable release tag
                required: true
                type: string
            dryRun:
                description: Do a dry run to validate without pushing
                required: true
                type: boolean
                default: true
            releaseOrderBranch:
                description: Logical release-order destination
                required: true
                type: choice
                options: [release-order-a, release-order-b, release-order-c]

concurrency:
    group: ${{ startsWith(inputs.releaseTag, 'v2.') && format('mparticle-web-sdk-v2-step-2-run-{0}', github.run_id) || format('mparticle-web-sdk-v3-release-{0}', inputs.releaseTag) }}
    cancel-in-progress: false

jobs:
    resolve-v3:
        if: ${{ !startsWith(inputs.releaseTag, 'v2.') }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            cycle_deployment_id: ${{ steps.resolve.outputs.cycle_deployment_id }}
            cycle_id: ${{ steps.resolve.outputs.cycle_id }}
            expected_target_sha: ${{ steps.resolve.outputs.expected_target_sha }}
            target_branch: ${{ steps.resolve.outputs.target_branch }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with: {ref: '${{ github.sha }}'}
            - id: resolve
              env:
                  ACTIVATION_ENABLED: ${{ vars.V3_RELEASE_ACTIVATED }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.releaseTag }}
                  RELEASE_ORDER_INPUT: ${{ inputs.releaseOrderBranch }}
              run: |
                  set -eu
                  test "$GITHUB_REPOSITORY" = mParticle/mparticle-web-sdk
                  test "$GITHUB_REPOSITORY_OWNER" = mParticle
                  test "$ACTIVATION_ENABLED" = true
                  test "$GITHUB_EVENT_NAME" = workflow_dispatch
                  test "$GITHUB_REF" = refs/heads/main
                  test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/staging-step-2.yml@refs/heads/main"
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                  test "$(git ls-remote --exit-code origin refs/heads/main |
                      awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
                  node -e "require('./scripts/release/promotion').assertStableTag(process.argv[1])" "$RELEASE_TAG"
                  case "$RELEASE_ORDER_INPUT" in release-order-a|release-order-b|release-order-c) ;; *) exit 1;; esac
                  TARGET_BRANCH="v3-${RELEASE_ORDER_INPUT}"
                  mkdir "$RUNNER_TEMP/records"
                  gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/records" --pattern release-envelope.json --pattern candidate-manifest.json
                  node scripts/release/promotion.js resolve --record-directory "$RUNNER_TEMP/records" --tag "$RELEASE_TAG"
                  echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
                  echo "expected_target_sha=$(git ls-remote --exit-code origin refs/heads/${TARGET_BRANCH} | awk 'NR == 1 {print $1}')" >> "$GITHUB_OUTPUT"

    v2:
        if: startsWith(inputs.releaseTag, 'v2.')
        uses: ./.github/workflows/reusable-v2-staging-step-2.yml
        permissions:
            contents: write
        with:
            releaseTag: ${{ inputs.releaseTag }}
            dryRun: ${{ inputs.dryRun }}
            releaseOrderBranch: ${{ inputs.releaseOrderBranch }}
        secrets:
            MP_SEMANTIC_RELEASE_BOT: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}

    v3:
        if: ${{ !startsWith(inputs.releaseTag, 'v2.') && needs.resolve-v3.result == 'success' && inputs.dryRun == false }}
        needs: resolve-v3
        uses: ./.github/workflows/reusable-v3-staging-step-2.yml
        permissions:
            actions: read
            attestations: read
            contents: write
        with:
            cycle_deployment_id: ${{ fromJSON(needs.resolve-v3.outputs.cycle_deployment_id) }}
            cycle_id: ${{ needs.resolve-v3.outputs.cycle_id }}
            expected_target_sha: ${{ needs.resolve-v3.outputs.expected_target_sha }}
            release_tag: ${{ inputs.releaseTag }}
            target_branch: ${{ needs.resolve-v3.outputs.target_branch }}

    reject-v3-dry-run:
        if: ${{ !startsWith(inputs.releaseTag, 'v2.') && inputs.dryRun }}
        runs-on: ubuntu-latest
        steps:
            - run: echo 'V3 Step 2 requires dryRun=false; exact reusable preflight is non-mutating until its leased push.' >&2; exit 1
