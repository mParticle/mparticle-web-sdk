name: 'Staging Release - Step 1: Prepare CDN Pre-Release, Publish NPM'
run-name: 'Staging Release - Step 1 [${{ inputs.track }}]'

on:
    workflow_dispatch:
        inputs:
            track:
                description: Release track
                required: true
                type: choice
                options: [v2, v3]
                default: v2
            dryRun:
                description: Do a dry run to preview instead of a real release
                required: true
                type: boolean
                default: true
            resumeKitReleaseTag:
                description: Legacy v2 recovery input
                required: false
                type: string
                default: ''
            version:
                description: V3 only - exact VERSION for the active cycle
                required: false
                type: string
                default: ''
            v3Mode:
                description: V3 execution mode
                required: false
                type: choice
                options: [fresh, recovery]
                default: fresh
            recoveryLifecycleDeploymentId:
                description: V3 recovery only - exact lifecycle deployment ID
                required: false
                type: number
                default: 0

concurrency:
    group: ${{ inputs.track == 'v2' && format('mparticle-web-sdk-v2-step-1-run-{0}', github.run_id) || format('mparticle-web-sdk-v3-release-v{0}', inputs.version) }}
    cancel-in-progress: false

jobs:
    resolve-v3:
        if: inputs.track == 'v3'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: read
        outputs:
            cycle_deployment_id: ${{ steps.resolve.outputs.cycle_deployment_id }}
            cycle_id: ${{ steps.resolve.outputs.cycle_id }}
            source_sha: ${{ steps.resolve.outputs.source_sha }}
            staging_sha: ${{ steps.resolve.outputs.staging_sha }}
            recovery_artifact_created_at: ${{ steps.resolve.outputs.recovery_artifact_created_at }}
            recovery_artifact_digest: ${{ steps.resolve.outputs.recovery_artifact_digest }}
            recovery_artifact_expires_at: ${{ steps.resolve.outputs.recovery_artifact_expires_at }}
            recovery_artifact_id: ${{ steps.resolve.outputs.recovery_artifact_id }}
            recovery_candidate_sha: ${{ steps.resolve.outputs.recovery_candidate_sha }}
            recovery_deployment_id: ${{ steps.resolve.outputs.recovery_deployment_id }}
            recovery_envelope_artifact_id: ${{ steps.resolve.outputs.recovery_envelope_artifact_id }}
            recovery_manifest_sha256: ${{ steps.resolve.outputs.recovery_manifest_sha256 }}
            recovery_origin_repository: ${{ steps.resolve.outputs.recovery_origin_repository }}
            recovery_origin_run_id: ${{ steps.resolve.outputs.recovery_origin_run_id }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.sha }}
            - id: resolve
              env:
                  ACTIVATION_ENABLED: ${{ vars.V3_RELEASE_ACTIVATED }}
                  GH_TOKEN: ${{ github.token }}
                  MODE: ${{ inputs.v3Mode }}
                  RECOVERY_DEPLOYMENT_ID: ${{ inputs.recoveryLifecycleDeploymentId }}
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: |
                  set -eu
                  test "$GITHUB_REPOSITORY" = mParticle/mparticle-web-sdk
                  test "$GITHUB_REPOSITORY_OWNER" = mParticle
                  test "$ACTIVATION_ENABLED" = true
                  test "$GITHUB_EVENT_NAME" = workflow_dispatch
                  test "$GITHUB_REF" = refs/heads/main
                  test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/staging-step-1.yml@refs/heads/main"
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                  test "$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
                  test "$(tr -d '\n' < VERSION)" = "$REQUESTED_VERSION"
                  node -e "require('./scripts/release/version').parseStableVersion(process.argv[1])" "$REQUESTED_VERSION"
                  case "$MODE" in fresh|recovery) ;; *) exit 1 ;; esac
                  if test "$MODE" = recovery; then
                      test "$RECOVERY_DEPLOYMENT_ID" -gt 0
                      gh api \
                          "repos/${GITHUB_REPOSITORY}/deployments/${RECOVERY_DEPLOYMENT_ID}" \
                          > "$RUNNER_TEMP/recovery.json"
                      jq -e --arg version "$REQUESTED_VERSION" '
                          .environment == "v3-release-lifecycle" and
                          .creator.login == "github-actions[bot]" and
                          .payload.version == $version and
                          .payload.caller_workflow.workflow_ref ==
                              (env.GITHUB_REPOSITORY +
                              "/.github/workflows/staging-step-1.yml@refs/heads/main")
                      ' "$RUNNER_TEMP/recovery.json" >/dev/null
                      CYCLE_DEPLOYMENT_ID="$(jq -r \
                          .payload.cycle_deployment_id \
                          "$RUNNER_TEMP/recovery.json")"
                      CYCLE_ID="$(jq -r .payload.cycle_id \
                          "$RUNNER_TEMP/recovery.json")"
                      SOURCE_SHA="$(jq -r .payload.source_sha \
                          "$RUNNER_TEMP/recovery.json")"
                      RECOVERY_CANDIDATE_SHA="$(jq -r .payload.candidate_sha \
                          "$RUNNER_TEMP/recovery.json")"
                      gh api --paginate --slurp \
                          "repos/${GITHUB_REPOSITORY}/deployments?environment=v3-release-lifecycle&per_page=100" \
                          | jq 'add // []' > "$RUNNER_TEMP/all-candidates.json"
                      jq --arg cycle "$CYCLE_ID" \
                          --argjson deployment "$CYCLE_DEPLOYMENT_ID" \
                          '[.[] | select(
                              .payload.cycle_id == $cycle or
                              .payload.cycle_deployment_id == $deployment
                          )]' "$RUNNER_TEMP/all-candidates.json" \
                          > "$RUNNER_TEMP/candidate-summaries.json"
                      echo '[]' > "$RUNNER_TEMP/candidates.json"
                      jq -r '.[].id' "$RUNNER_TEMP/candidate-summaries.json" |
                          while IFS= read -r ID; do
                              gh api \
                                  "repos/${GITHUB_REPOSITORY}/deployments/${ID}" \
                                  > "$RUNNER_TEMP/candidate.json"
                              gh api --paginate --slurp \
                                  "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses?per_page=100" \
                                  > "$RUNNER_TEMP/candidate-statuses.json"
                              jq --slurpfile candidate \
                                  "$RUNNER_TEMP/candidate.json" \
                                  --slurpfile statuses \
                                  "$RUNNER_TEMP/candidate-statuses.json" \
                                  '. + [($candidate[0] + {
                                      statuses: $statuses[0]
                                  })]' "$RUNNER_TEMP/candidates.json" \
                                  > "$RUNNER_TEMP/candidates.next.json"
                              mv "$RUNNER_TEMP/candidates.next.json" \
                                  "$RUNNER_TEMP/candidates.json"
                          done
                      node scripts/release/lifecycle-record.js \
                          authorize-candidate \
                          --deployments "$RUNNER_TEMP/candidates.json" \
                          --repository "$GITHUB_REPOSITORY" \
                          --cycle-deployment-id "$CYCLE_DEPLOYMENT_ID" \
                          --cycle-id "$CYCLE_ID" \
                          --source-sha "$SOURCE_SHA" \
                          --version "$REQUESTED_VERSION" \
                          --mode recovery \
                          --recovery-candidate-sha "$RECOVERY_CANDIDATE_SHA" \
                          --recovery-deployment-id "$RECOVERY_DEPLOYMENT_ID"
                      ORIGIN_RUN_ID="$(jq -r .payload.originating_run.run_id \
                          "$RUNNER_TEMP/recovery.json")"
                      ENVELOPE_NAME="v3-release-envelope-$(jq -r \
                          .payload.candidate_sha "$RUNNER_TEMP/recovery.json")"
                      gh api --paginate --slurp \
                          "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/artifacts?per_page=100" \
                          | jq --arg name "$ENVELOPE_NAME" \
                          '[.[].artifacts[] | select(.name == $name and .expired == false)]' \
                          > "$RUNNER_TEMP/envelopes.json"
                      test "$(jq length "$RUNNER_TEMP/envelopes.json")" = 1
                      jq -r '
                          .payload.actions_artifacts[0] |
                          "recovery_artifact_id=\(.id)\n" +
                          "recovery_artifact_digest=\(.digest)\n" +
                          "recovery_artifact_created_at=\(.created_at)\n" +
                          "recovery_artifact_expires_at=\(.expires_at)"
                      ' "$RUNNER_TEMP/recovery.json" >> "$GITHUB_OUTPUT"
                      jq -r '
                          "cycle_deployment_id=\(.payload.cycle_deployment_id)\n" +
                          "cycle_id=\(.payload.cycle_id)\n" +
                          "recovery_candidate_sha=\(.payload.candidate_sha)\n" +
                          "recovery_deployment_id=\(.id)\n" +
                          "recovery_manifest_sha256=\(.payload.manifest_sha256)\n" +
                          "recovery_origin_repository=\(.payload.originating_run.repository)\n" +
                          "recovery_origin_run_id=\(.payload.originating_run.run_id)"
                      ' "$RUNNER_TEMP/recovery.json" >> "$GITHUB_OUTPUT"
                      echo "recovery_envelope_artifact_id=$(jq -r \
                          '.[0].id' "$RUNNER_TEMP/envelopes.json")" \
                          >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  test "$RECOVERY_DEPLOYMENT_ID" = 0
                  gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/deployments?environment=v3-release-cycle&per_page=100" > "$RUNNER_TEMP/cycles-pages.json"
                  jq 'add' "$RUNNER_TEMP/cycles-pages.json" > "$RUNNER_TEMP/cycles.json"
                  : > "$RUNNER_TEMP/matches"
                  jq -r '.[] | select(.payload.version == env.REQUESTED_VERSION) | .id' "$RUNNER_TEMP/cycles.json" | while read -r id; do
                      statuses="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=100")"
                      deployment="$(jq -c --argjson id "$id" \
                          '.[] | select(.id == $id)' "$RUNNER_TEMP/cycles.json")"
                      effective="$(DEPLOYMENT="$deployment" STATUSES="$statuses" \
                          node -e "
                          const cycle = require('./scripts/release/release-cycle');
                          const deployment = JSON.parse(process.env.DEPLOYMENT);
                          const statuses = JSON.parse(process.env.STATUSES);
                          if (cycle.logicalCycleState(statuses) !== 'active') {
                              process.exit(2);
                          }
                          process.stdout.write(
                              cycle.effectiveSourceSha(deployment, statuses)
                          );
                          ")" || continue
                      test "$effective" = "$GITHUB_SHA" || continue
                      jq -cn --argjson deployment "$deployment" \
                          --arg source "$effective" \
                          '{deployment: $deployment, source: $source}' \
                          >> "$RUNNER_TEMP/matches"
                  done
                  test "$(wc -l < "$RUNNER_TEMP/matches" | tr -d ' ')" = 1
                  MATCH="$(cat "$RUNNER_TEMP/matches")"
                  echo "cycle_deployment_id=$(jq -r .deployment.id <<<"$MATCH")" >> "$GITHUB_OUTPUT"
                  echo "cycle_id=$(jq -r .deployment.payload.cycle_id <<<"$MATCH")" >> "$GITHUB_OUTPUT"
                  echo "source_sha=$(jq -r .source <<<"$MATCH")" >> "$GITHUB_OUTPUT"
                  echo "staging_sha=$(git ls-remote --exit-code origin refs/heads/v3-staging | awk 'NR == 1 {print $1}')" >> "$GITHUB_OUTPUT"

    v2:
        if: inputs.track == 'v2'
        uses: ./.github/workflows/reusable-v2-staging-step-1.yml
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        with:
            track: v2
            dryRun: ${{ inputs.dryRun }}
            resumeKitReleaseTag: ${{ inputs.resumeKitReleaseTag }}
        secrets:
            MP_SEMANTIC_RELEASE_BOT: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
            GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
            GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    v3:
        if: inputs.track == 'v3' && needs.resolve-v3.result == 'success'
        needs: resolve-v3
        uses: ./.github/workflows/reusable-v3-staging-step-1.yml
        permissions:
            actions: read
            attestations: write
            contents: write
            deployments: write
            id-token: write
            packages: write
        with:
            cycle_deployment_id: ${{ fromJSON(needs.resolve-v3.outputs.cycle_deployment_id) }}
            cycle_id: ${{ needs.resolve-v3.outputs.cycle_id }}
            expected_staging_sha: ${{ inputs.v3Mode == 'fresh' && needs.resolve-v3.outputs.staging_sha || '' }}
            mode: ${{ inputs.v3Mode }}
            source_sha: ${{ inputs.v3Mode == 'fresh' && needs.resolve-v3.outputs.source_sha || '' }}
            recovery_artifact_created_at: ${{ needs.resolve-v3.outputs.recovery_artifact_created_at }}
            recovery_artifact_digest: ${{ needs.resolve-v3.outputs.recovery_artifact_digest }}
            recovery_artifact_expires_at: ${{ needs.resolve-v3.outputs.recovery_artifact_expires_at }}
            recovery_artifact_id: ${{ needs.resolve-v3.outputs.recovery_artifact_id }}
            recovery_candidate_sha: ${{ needs.resolve-v3.outputs.recovery_candidate_sha }}
            recovery_deployment_id: ${{ needs.resolve-v3.outputs.recovery_deployment_id }}
            recovery_envelope_artifact_id: ${{ needs.resolve-v3.outputs.recovery_envelope_artifact_id }}
            recovery_manifest_sha256: ${{ needs.resolve-v3.outputs.recovery_manifest_sha256 }}
            recovery_origin_repository: ${{ needs.resolve-v3.outputs.recovery_origin_repository }}
            recovery_origin_run_id: ${{ needs.resolve-v3.outputs.recovery_origin_run_id }}
            recovery_version: ${{ inputs.v3Mode == 'recovery' && inputs.version || '' }}
