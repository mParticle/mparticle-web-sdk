name: 'V3 Release - Step 1: Prepare CDN Pre-Release, Publish NPM'
run-name: 'V3 Release - Step 1'

# The V3 release, Step 1. V2 releases with staging-step-1.yml.
# npm trusted publishing names this file for @mparticle/web-sdk and every kit
# package. It publishes the next dist-tag until npm publishing moves into its
# own workflow.

on:
    workflow_dispatch:
        inputs:
            dryRun:
                description: 'Do a dry run to preview instead of a real release [true/false]'
                required: true
                type: boolean
                default: true
            resumeKitReleaseTag:
                description: 'Recovery only: resume kit publishing from an existing Step 1 tag'
                required: false
                type: string
                default: ''

permissions: {}

concurrency:
    group: mparticle-web-sdk-release-publish
    cancel-in-progress: false

jobs:
    # The V3 staging release is performed on v3-staging.
    confirm-staging-branch:
        name: Confirm v3 staging release state
        runs-on: ubuntu-latest
        outputs:
            development_branch: ${{ steps.resolve.outputs.development_branch }}
            candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
            staging_branch: ${{ steps.resolve.outputs.staging_branch }}
            release_branch: ${{ steps.resolve.outputs.release_branch }}
            npm_dist_tag: ${{ steps.resolve.outputs.npm_dist_tag }}
        permissions:
            contents: read
        steps:
            - name: Checkout workflow source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0

            - name: Validate workflow source
              env:
                  SOURCE_REF: ${{ github.ref }}
                  TRACK: v3
                  DRY_RUN: ${{ github.event.inputs.dryRun }}
                  RESUME_KIT_RELEASE_TAG: ${{ inputs.resumeKitReleaseTag }}
              run: |
                  set -eu
                  case "${TRACK}|${SOURCE_REF}" in
                      "v3|refs/heads/v3-staging") ;;
                      *)
                          echo "Track ${TRACK} must dispatch from its staging branch; received ${SOURCE_REF}"
                          exit 1
                          ;;
                  esac

                  if [ -n "$RESUME_KIT_RELEASE_TAG" ]; then
                      if [ "$DRY_RUN" != "false" ]; then
                          echo "Kit recovery requires dryRun=false"
                          exit 1
                      fi
                      if ! printf '%s\n' "$RESUME_KIT_RELEASE_TAG" |
                          grep -Eq '^v3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
                          echo "Kit recovery requires a stable v3 release tag"
                          exit 1
                      fi
                  fi

                  # The running copy must match the V3 trunk, so a workflow
                  # edit reaches a real release only through review.
                  if [ "$DRY_RUN" = "false" ]; then
                      case "$TRACK" in
                          v3) APPROVED_BRANCH="main" ;;
                          *) exit 1 ;;
                      esac
                      git fetch --no-tags --force origin \
                          "refs/heads/${APPROVED_BRANCH}:refs/remotes/origin/${APPROVED_BRANCH}"
                      APPROVED_TRUNK="refs/remotes/origin/${APPROVED_BRANCH}"
                      STEP_ONE_WORKFLOW=".github/workflows/v3-release-step-1.yml"
                      if ! git diff --quiet \
                          "HEAD:${STEP_ONE_WORKFLOW}" \
                          "${APPROVED_TRUNK}:${STEP_ONE_WORKFLOW}"; then
                          echo "${STEP_ONE_WORKFLOW} on ${SOURCE_REF} differs from ${APPROVED_TRUNK}"
                          echo "Synchronize the staging branch from its approved trunk before releasing"
                          exit 1
                      fi
                  fi

                  {
                      printf '## Workflow source validation\n\n'
                      printf -- '- Source ref: `%s`\n' "$SOURCE_REF"
                      printf -- '- Dry run: `%s`\n' "$DRY_RUN"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Resolve exact branch mapping
              id: resolve
              env:
                  TRACK: v3
                  RESUME_KIT_RELEASE_TAG: ${{ inputs.resumeKitReleaseTag }}
              run: |
                  set -eu
                  case "$TRACK" in
                      v3)
                          DEVELOPMENT_BRANCH="v3-development"
                          STAGING_BRANCH="v3-staging"
                          RELEASE_BRANCH="v3-release/step1-${GITHUB_RUN_ID}"
                          NPM_DIST_TAG="next"
                          ;;
                      *) exit 1 ;;
                  esac

                  if [ -n "$RESUME_KIT_RELEASE_TAG" ]; then
                      # Recovery is authoritative from the immutable Step 1 tag,
                      # not from development, which intentionally remains at the
                      # pre-release source commit.
                      git tag -d "$RESUME_KIT_RELEASE_TAG" >/dev/null 2>&1 || true
                      git fetch --no-tags --force origin \
                          "refs/tags/${RESUME_KIT_RELEASE_TAG}:refs/tags/${RESUME_KIT_RELEASE_TAG}"
                      CANDIDATE_SHA="$(
                          git rev-parse "${RESUME_KIT_RELEASE_TAG}^{commit}"
                      )"
                  else
                      # Freeze the candidate before any build or test starts.
                      # Every downstream job checks out this exact commit rather
                      # than a development branch that can move during the run.
                      git fetch --no-tags --force origin \
                          "refs/heads/${DEVELOPMENT_BRANCH}:refs/remotes/origin/${DEVELOPMENT_BRANCH}"
                      CANDIDATE_SHA="$(
                          git rev-parse "refs/remotes/origin/${DEVELOPMENT_BRANCH}^{commit}"
                      )"
                  fi

                  {
                      echo "development_branch=${DEVELOPMENT_BRANCH}"
                      echo "candidate_sha=${CANDIDATE_SHA}"
                      echo "staging_branch=${STAGING_BRANCH}"
                      echo "release_branch=${RELEASE_BRANCH}"
                      echo "npm_dist_tag=${NPM_DIST_TAG}"
                  } >> "$GITHUB_OUTPUT"

            - name: Checkout ${{ steps.resolve.outputs.staging_branch }}
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  ref: ${{ steps.resolve.outputs.staging_branch }}

            - name: Validate track mapping and checkout
              env:
                  TRACK: v3
                  DEVELOPMENT_BRANCH: ${{ steps.resolve.outputs.development_branch }}
                  STAGING_BRANCH: ${{ steps.resolve.outputs.staging_branch }}
                  RELEASE_BRANCH: ${{ steps.resolve.outputs.release_branch }}
                  NPM_DIST_TAG: ${{ steps.resolve.outputs.npm_dist_tag }}
                  CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
                  RESUME_KIT_RELEASE_TAG: ${{ inputs.resumeKitReleaseTag }}
              run: |
                  # Verify the selected track uses approved release settings and
                  # the checkout matches the current remote staging commit.
                  set -eu
                  MAPPING="${TRACK}|${DEVELOPMENT_BRANCH}|${STAGING_BRANCH}|${RELEASE_BRANCH}|${NPM_DIST_TAG}"
                  case "$MAPPING" in
                      "v3|v3-development|v3-staging|v3-release/step1-${GITHUB_RUN_ID}|next")
                          ;;
                      *) exit 1 ;;
                  esac
                  if [ ! -f release.config.js ]; then
                      echo "release.config.js is required on ${STAGING_BRANCH}"
                      exit 1
                  fi
                  # --branches on semantic-release is authoritative for this
                  # staging release; the shared config need not name staging.
                  node <<'NODE'
                  const config = require('./release.config.js');
                  if (
                      !Array.isArray(config.branches) ||
                      config.branches.length === 0
                  ) {
                      console.error(
                          'release.config.js must declare at least one release branch'
                      );
                      process.exit(1);
                  }
                  NODE
                  CHECKED_OUT_SHA="$(git rev-parse HEAD)"
                  EXPECTED_SHA="$(git ls-remote --exit-code origin "refs/heads/${STAGING_BRANCH}" | awk 'NR == 1 { print $1 }')"
                  if [ -z "$EXPECTED_SHA" ] || [ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]; then
                      echo "Checkout does not match origin/${STAGING_BRANCH}"
                      exit 1
                  fi
                  if ! printf '%s\n' "$CANDIDATE_SHA" |
                      grep -Eq '^[0-9a-f]{40}$'; then
                      echo "Candidate SHA is not a full commit SHA: ${CANDIDATE_SHA}"
                      exit 1
                  fi
                  if [ -n "$RESUME_KIT_RELEASE_TAG" ]; then
                      if [ "$CHECKED_OUT_SHA" != "$CANDIDATE_SHA" ]; then
                          echo "Recovery tag ${RESUME_KIT_RELEASE_TAG} resolves to ${CANDIDATE_SHA}, but origin/${STAGING_BRANCH} is ${CHECKED_OUT_SHA}"
                          exit 1
                      fi
                  elif ! git merge-base --is-ancestor \
                      "$CHECKED_OUT_SHA" "$CANDIDATE_SHA"; then
                      echo "origin/${STAGING_BRANCH} at ${CHECKED_OUT_SHA} is not an ancestor of candidate ${CANDIDATE_SHA}"
                      echo "The release source must fast-forward from staging to the tested candidate"
                      exit 1
                  fi

                  {
                      printf '## Frozen release candidate\n\n'
                      if [ -n "$RESUME_KIT_RELEASE_TAG" ]; then
                          printf -- '- Recovery tag: `%s`\n' "$RESUME_KIT_RELEASE_TAG"
                      else
                          printf -- '- Development branch: `%s`\n' "$DEVELOPMENT_BRANCH"
                      fi
                      printf -- '- Candidate SHA: `%s`\n' "$CANDIDATE_SHA"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Validate reachable release tag major
              if: ${{ inputs.resumeKitReleaseTag == '' }}
              env:
                  TRACK: v3
              run: |
                  set -eu
                  # Stop a wrong-major semantic-release lineage before expensive tests.
                  STABLE_TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                  case "$TRACK" in
                      v3) EXPECTED_MAJOR=3 ;;
                      *) exit 1 ;;
                  esac
                  BASELINE_TAG="$(
                      git tag --merged HEAD --list 'v*' --sort=-v:refname |
                          awk -v pattern="$STABLE_TAG_PATTERN" \
                              '$0 ~ pattern { print; exit }'
                  )"
                  if [ -z "$BASELINE_TAG" ]; then
                      echo "Track ${TRACK} expects major ${EXPECTED_MAJOR}, but no stable release tag is reachable from staging HEAD"
                      exit 1
                  fi

                  FOUND_MAJOR="${BASELINE_TAG#v}"
                  FOUND_MAJOR="${FOUND_MAJOR%%.*}"
                  if [ "$FOUND_MAJOR" != "$EXPECTED_MAJOR" ]; then
                      echo "Track ${TRACK} expects major ${EXPECTED_MAJOR}, but highest reachable stable tag ${BASELINE_TAG} has major ${FOUND_MAJOR}"
                      exit 1
                  fi

                  {
                      printf '## Release tag baseline\n\n'
                      printf -- '- Track: `%s`\n' "$TRACK"
                      printf -- '- Highest reachable stable tag: `%s`\n' "$BASELINE_TAG"
                  } >> "$GITHUB_STEP_SUMMARY"

    build-bundle:
        name: Build Distribution Bundle
        if: ${{ inputs.resumeKitReleaseTag == '' }}
        runs-on: ubuntu-latest
        needs: confirm-staging-branch
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

            - name: NPM install
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x

            - name: Run NPM CI
              run: npm ci

            - name: Lint with ESLint
              run: npm run lint

            - name: Lint with Prettier
              run: npm run prettier

            - name: Run Build IIFE
              run: npm run build:iife

            - name: Display Bundle Diff, but Fancy!
              run: git diff --unified=3 dist/mparticle.js | npx diff-so-fancy

            - name: Archive npm failure logs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: failure()
              with:
                  name: npm-logs-build-bundle
                  path: ~/.npm/_logs

    # Currently, we're only using Jest to test TypeScript modules
    # and they do not require any built files
    test-jest:
        name: 'Test Jest'
        if: ${{ inputs.resumeKitReleaseTag == '' }}
        runs-on: 'ubuntu-latest'
        needs: confirm-staging-branch
        strategy:
            matrix:
                node-version: [18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x]
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

            - name: NPM install
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Run NPM CI
              run: npm ci

            - name: Run Jest Tests
              run: npm run test:jest

            - name: Archive npm failure logs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: failure()
              with:
                  name: npm-logs-test-jest-${{ matrix.node-version }}
                  path: ~/.npm/_logs

    # Only Core test requires bundle, but we want to make sure
    # that tests only run when the bundle is successfully built
    test-core:
        name: Core Tests
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-jest
            - build-bundle
        with:
            test_command_label: Core SDK Tests
            test_command: npm run test
            build_command: npm run build:iife
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

    # Test Sub can be run independent of other tests
    test-stub:
        name: 'Test Stub'
        runs-on: ubuntu-latest
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

            - name: NPM install
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x

            - name: Run NPM CI
              run: npm ci

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2

            - name: Log Firefox Version
              run: firefox --version

            - name: Run Stub Tests
              run: npm run test:stub

            - name: Archive npm failure logs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: failure()
              with:
                  name: npm-logs-test-stub
                  path: ~/.npm/_logs

    # Integration Tests run the same suite of tests against various build systems
    # to make sure our SDK will run in different environments

    test-integrations-require-js:
        name: 'Integration Tests: Require JS'
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Require JS Test
            test_command: npm run test:requirejs
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

    test-integrations-common-js-browserfy:
        name: 'Integration Tests: Browserfy Common JS'
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Browserfy CJS Test
            test_command: npm run test:integrations:cjs:browserfy
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-common-js-webpack:
        name: 'Integration Tests: webpack Common JS'
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: webpack CJS Test
            test_command: npm run test:integrations:cjs:webpack
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-common-js-rollup:
        name: 'Integration Tests: Rollup Common JS'
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Rollup CJS Test
            test_command: npm run test:integrations:cjs:rollup
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-module-js-webpack:
        name: 'Integration Tests: webpack Module JS'
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: webpack Module Test
            test_command: npm run test:integrations:module:webpack
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
            build_command: npm run build:esm && npm run build:test-bundle

    test-integrations-module-js-rollup:
        name: 'Integration Tests: Rollup Module JS'
        permissions:
            contents: read
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # main
        needs:
            - confirm-staging-branch
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Rollup Module Test
            test_command: npm run test:integrations:module:rollup
            branch_name: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
            build_command: npm run build:esm && npm run build:test-bundle

    load-kit-matrix:
        name: Load V3 kit test matrix
        if: ${{ inputs.resumeKitReleaseTag == '' }}
        runs-on: ubuntu-latest
        needs: confirm-staging-branch
        outputs:
            matrix: ${{ steps.load.outputs.matrix }}
        permissions:
            contents: read
        steps:
            - name: Checkout frozen release candidate
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

            - name: Validate and load kit test matrix
              id: load
              run: |
                  set -eu
                  MATRIX_FILE="kits/matrix.json"
                  if [ ! -f "$MATRIX_FILE" ]; then
                      echo "${MATRIX_FILE} is required for V3 kit testing"
                      exit 1
                  fi
                  if ! jq -e '
                      type == "array" and
                      length > 0 and
                      all(.[];
                          type == "object" and
                          (.name | type == "string" and length > 0) and
                          (.local_path | type == "string" and length > 0)
                      )
                  ' "$MATRIX_FILE" > /dev/null; then
                      echo "${MATRIX_FILE} must be a non-empty JSON array whose entries have non-empty string name and local_path fields"
                      exit 1
                  fi
                  echo "matrix=$(jq -c . "$MATRIX_FILE")" >> "$GITHUB_OUTPUT"

    run-kit-tests:
        name: 'Kit Tests: ${{ matrix.kit.name }}'
        needs:
            - confirm-staging-branch
            - load-kit-matrix
            - build-bundle
            - test-jest
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                kit: ${{ fromJson(needs.load-kit-matrix.outputs.matrix) }}
        permissions:
            contents: read
        steps:
            - name: Checkout frozen release candidate
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2

            - name: Install, build, and test kit
              working-directory: ${{ matrix.kit.local_path }}
              run: |
                  set -eu
                  npm ci
                  npm run build
                  npm test

            - name: Archive npm failure logs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: failure()
              with:
                  name: npm-logs-kit-${{ strategy.job-index }}
                  path: ~/.npm/_logs

    create-release-branch:
        name: Create release branch
        runs-on: ubuntu-latest
        # always() with exact result checks prevents failed, cancelled, or
        # unexpected skips.
        if: >-
            ${{
                always() &&
                !cancelled() &&
                needs.confirm-staging-branch.result == 'success' &&
                needs.build-bundle.result == 'success' &&
                needs.test-jest.result == 'success' &&
                needs.test-core.result == 'success' &&
                needs.test-stub.result == 'success' &&
                needs.test-integrations-common-js-browserfy.result == 'success' &&
                needs.test-integrations-common-js-webpack.result == 'success' &&
                needs.test-integrations-common-js-rollup.result == 'success' &&
                needs.test-integrations-module-js-webpack.result == 'success' &&
                needs.test-integrations-module-js-rollup.result == 'success' &&
                needs.test-integrations-require-js.result == 'success' &&
                needs.load-kit-matrix.result == 'success' &&
                needs.run-kit-tests.result == 'success'
            }}
        needs:
            - build-bundle
            - test-jest
            - test-core
            - test-stub
            - test-integrations-common-js-browserfy
            - test-integrations-common-js-webpack
            - test-integrations-common-js-rollup
            - test-integrations-module-js-webpack
            - test-integrations-module-js-rollup
            - test-integrations-require-js
            - load-kit-matrix
            - run-kit-tests
            - confirm-staging-branch
        permissions:
            contents: write # Push the release branch with checkout's default token.
        steps:
            - name: Checkout frozen release candidate
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  repository: mparticle/mparticle-web-sdk
                  ref: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}

            - name: Create and push release branch
              if: ${{ github.event.inputs.dryRun == 'false' }}
              env:
                  RELEASE_BRANCH: ${{ needs.confirm-staging-branch.outputs.release_branch }}
              run: |
                  set -eu
                  git checkout -b "$RELEASE_BRANCH"
                  git push origin "$RELEASE_BRANCH"

    release:
        name: Perform Release
        runs-on: ubuntu-latest
        if: >-
            ${{
                always() &&
                !cancelled() &&
                needs.create-release-branch.result == 'success' &&
                needs.confirm-staging-branch.result == 'success'
            }}
        needs:
            - create-release-branch
            - confirm-staging-branch
        outputs:
            release_sha: ${{ steps.verify-release.outputs.release_sha }}
            release_tag: ${{ steps.verify-release.outputs.release_tag }}
            release_version: ${{ steps.verify-release.outputs.release_version }}

        # OIDC permissions for npm trusted publishing
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write

        env:
            GITHUB_TOKEN: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
            GIT_AUTHOR_NAME: mparticle-automation
            GIT_AUTHOR_EMAIL: developers@mparticle.com
            GIT_COMMITTER_NAME: mparticle-automation
            GIT_COMMITTER_EMAIL: developers@mparticle.com
            TRACK: v3
            NPM_DIST_TAG: ${{ needs.confirm-staging-branch.outputs.npm_dist_tag }}
            NPM_CONFIG_TAG: ${{ needs.confirm-staging-branch.outputs.npm_dist_tag }}

        steps:
            - name: Checkout ${{ needs.confirm-staging-branch.outputs.staging_branch }}
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  ref: ${{ needs.confirm-staging-branch.outputs.staging_branch }}

            - name: Configure release paths
              run: |
                  echo "NEXT_RELEASE_VERSION_FILE=$RUNNER_TEMP/next-release-version" >> "$GITHUB_ENV"

            - name: Import GPG Key
              uses: crazy-max/ghaction-import-gpg@e00cb83a68c1158b29afc5217dd0582cada6d172 #v4.4.0
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.GPG_PASSPHRASE }}
                  git_user_signingkey: true
                  git_commit_gpgsign: true

            - name: Merge frozen candidate into staging preview
              if: ${{ github.event.inputs.dryRun == 'true' }}
              env:
                  CANDIDATE_SHA: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
              run: |
                  set -eu
                  git fetch --no-tags origin "$CANDIDATE_SHA"
                  git merge --ff-only "$CANDIDATE_SHA"
                  MERGED_SHA="$(git rev-parse HEAD)"
                  if [ "$MERGED_SHA" != "$CANDIDATE_SHA" ]; then
                      echo "Dry-run staging merge resolved to ${MERGED_SHA}, expected tested candidate ${CANDIDATE_SHA}"
                      exit 1
                  fi

            - name: Merge release branch into staging branch
              if: ${{ github.event.inputs.dryRun == 'false' }}
              env:
                  RELEASE_BRANCH: ${{ needs.confirm-staging-branch.outputs.release_branch }}
                  CANDIDATE_SHA: ${{ needs.confirm-staging-branch.outputs.candidate_sha }}
              run: |
                  set -eu
                  git fetch --no-tags origin "$RELEASE_BRANCH"
                  RELEASE_BRANCH_SHA="$(git rev-parse FETCH_HEAD)"
                  if [ "$RELEASE_BRANCH_SHA" != "$CANDIDATE_SHA" ]; then
                      echo "Release branch ${RELEASE_BRANCH} points to ${RELEASE_BRANCH_SHA}, expected tested candidate ${CANDIDATE_SHA}"
                      exit 1
                  fi
                  git merge --ff-only "$RELEASE_BRANCH_SHA"
                  MERGED_SHA="$(git rev-parse HEAD)"
                  if [ "$MERGED_SHA" != "$CANDIDATE_SHA" ]; then
                      echo "Staging merge resolved to ${MERGED_SHA}, expected tested candidate ${CANDIDATE_SHA}"
                      exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.19.0
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Verify npm version
              run: npm --version

            - name: Verify npm dist-tag
              run: |
                  set -eu
                  CONFIGURED_TAG="$(npm config get tag)"
                  if [ "$CONFIGURED_TAG" != "$NPM_DIST_TAG" ]; then
                      echo "Expected npm dist-tag ${NPM_DIST_TAG}, received ${CONFIGURED_TAG}"
                      exit 1
                  fi

            - name: Release --dry-run
              if: ${{ github.event.inputs.dryRun == 'true' }}
              env:
                  STAGING_BRANCH: ${{ needs.confirm-staging-branch.outputs.staging_branch }}
              run: |
                  set -eu
                  # The dispatch ref is the selected staging branch. Preserve
                  # GitHub's authentic identity variables for OIDC provenance.
                  npx semantic-release --branches "$STAGING_BRANCH" --dry-run

            - name: Preview V3 kit release
              if: ${{ github.event.inputs.dryRun == 'true' }}
              run: |
                  set -eu
                  if [ ! -s "$NEXT_RELEASE_VERSION_FILE" ]; then
                      echo "No V3 release was predicted, so there are no kit artifacts to preview."
                      exit 0
                  fi
                  RELEASE_VERSION="$(cat "$NEXT_RELEASE_VERSION_FILE")"
                  node scripts/preview-kit-release.js "$RELEASE_VERSION"

            - name: Snapshot existing stable release tags
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: |
                  set -eu
                  REMOTE_TAG_REFS="$RUNNER_TEMP/remote-tag-refs-before"
                  STABLE_TAGS="$RUNNER_TEMP/stable-release-tags-before"
                  git ls-remote --exit-code --tags --refs origin > "$REMOTE_TAG_REFS"
                  if [ ! -s "$REMOTE_TAG_REFS" ]; then
                      echo "Remote tag snapshot is unexpectedly empty"
                      exit 1
                  fi
                  awk '$2 ~ /^refs\/tags\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ {
                          sub("^refs/tags/", "", $2)
                          print $2
                      }' "$REMOTE_TAG_REFS" > "$STABLE_TAGS"

            # NPM Publish happens here
            - name: Release
              if: ${{ github.event.inputs.dryRun == 'false' }}
              env:
                  STAGING_BRANCH: ${{ needs.confirm-staging-branch.outputs.staging_branch }}
              run: |
                  set -eu
                  # npm trusted publishing must receive GitHub's authentic,
                  # OIDC-aligned workflow identity.
                  npx semantic-release --branches "$STAGING_BRANCH"

            - name: Archive npm failure logs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: failure()
              with:
                  name: npm-logs-release
                  path: ~/.npm/_logs

            - name: Push automated release commits to release branch
              if: ${{ github.event.inputs.dryRun == 'false' }}
              env:
                  RELEASE_BRANCH: ${{ needs.confirm-staging-branch.outputs.release_branch }}
              run: |
                  set -eu
                  git push origin "HEAD:${RELEASE_BRANCH}"

            - name: Verify and report release candidate
              id: verify-release
              if: ${{ github.event.inputs.dryRun == 'false' }}
              run: |
                  set -eu
                  CANDIDATE_SHA="$(git rev-parse HEAD)"
                  git fetch --force --tags origin

                  STABLE_TAGS="$(git tag --points-at "$CANDIDATE_SHA" |
                      awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/')"
                  TAG_COUNT="$(printf '%s\n' "$STABLE_TAGS" |
                      awk 'NF { count++ } END { print count + 0 }')"
                  if [ "$TAG_COUNT" -ne 1 ]; then
                      echo "Expected exactly one stable release tag at ${CANDIDATE_SHA}; found ${TAG_COUNT}"
                      exit 1
                  fi
                  RELEASE_TAG="$(printf '%s\n' "$STABLE_TAGS" | awk 'NF { print; exit }')"
                  if grep -Fqx "$RELEASE_TAG" "$RUNNER_TEMP/stable-release-tags-before"; then
                      echo "Release tag ${RELEASE_TAG} existed before this workflow run"
                      exit 1
                  fi

                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  if [ "v${PACKAGE_VERSION}" != "$RELEASE_TAG" ]; then
                      echo "package.json version ${PACKAGE_VERSION} does not match ${RELEASE_TAG}"
                      exit 1
                  fi
                  PACKAGE_MAJOR="${PACKAGE_VERSION%%.*}"
                  case "${TRACK}|${PACKAGE_MAJOR}" in
                      "v3|3") ;;
                      *)
                          echo "Track ${TRACK} does not match release major ${PACKAGE_MAJOR}"
                          exit 1
                          ;;
                  esac

                  REMOTE_TAG_REFS="$(git ls-remote --exit-code --tags origin \
                      "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
                  REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                      awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
                  if [ -z "$REMOTE_TAG_SHA" ]; then
                      REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                          awk '$2 !~ /\^\{\}$/ { print $1; exit }')"
                  fi
                  if [ "$REMOTE_TAG_SHA" != "$CANDIDATE_SHA" ]; then
                      echo "Remote tag ${RELEASE_TAG} does not resolve to ${CANDIDATE_SHA}"
                      exit 1
                  fi
                  {
                      echo "release_sha=${CANDIDATE_SHA}"
                      echo "release_tag=${RELEASE_TAG}"
                      echo "release_version=${PACKAGE_VERSION}"
                  } >> "$GITHUB_OUTPUT"

                  {
                      printf '## Release candidate ready\n\n'
                      printf -- '- Track: `%s`\n' "$TRACK"
                      printf -- '- Release tag: `%s`\n' "$RELEASE_TAG"
                      printf -- '- Version: `%s`\n' "$PACKAGE_VERSION"
                      printf -- '- Candidate SHA: `%s`\n' "$CANDIDATE_SHA"
                      printf -- '- npm dist-tag: `%s`\n\n' "$NPM_DIST_TAG"
                      printf 'Step 2 is optional and release-order A/B/C are unordered.\n\n'
                      PROMOTION_REF="main"
                      printf '### Preview commands\n\n```sh\n'
                      printf 'gh workflow run v3-release-step-2.yml --ref %s -f releaseTag=%s -f releaseOrderBranch=release-order-a -f dryRun=true\n' "$PROMOTION_REF" "$RELEASE_TAG"
                      printf 'gh workflow run v3-release-step-3.yml --ref %s -f releaseTag=%s\n' "$PROMOTION_REF" "$RELEASE_TAG"
                      printf '```\n'
                  } >> "$GITHUB_STEP_SUMMARY"

    publish-kits:
        name: Publish V3 kits
        if: >-
            ${{
                always() &&
                !cancelled() &&
                github.event.inputs.dryRun == 'false' &&
                needs.confirm-staging-branch.result == 'success' &&
                (
                    inputs.resumeKitReleaseTag != '' ||
                    needs.release.result == 'success'
                )
            }}
        needs:
            - confirm-staging-branch
            - release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        outputs:
            release_sha: ${{ steps.source.outputs.release_sha }}
            release_version: ${{ steps.source.outputs.release_version }}
        env:
            NPM_DIST_TAG: ${{ needs.confirm-staging-branch.outputs.npm_dist_tag }}
            KIT_RELEASE_RECOVERY: ${{ inputs.resumeKitReleaseTag != '' }}
        steps:
            - name: Checkout immutable release tag
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.resumeKitReleaseTag || needs.release.outputs.release_tag }}

            - name: Verify immutable release source
              id: source
              env:
                  EXPECTED_SHA: ${{ needs.release.outputs.release_sha }}
                  RELEASE_TAG: ${{ inputs.resumeKitReleaseTag || needs.release.outputs.release_tag }}
              run: |
                  set -eu
                  CHECKED_OUT_SHA="$(git rev-parse HEAD)"
                  if [ -n "$EXPECTED_SHA" ] && [ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]; then
                      echo "${RELEASE_TAG} resolves to ${CHECKED_OUT_SHA}, expected ${EXPECTED_SHA}"
                      exit 1
                  fi
                  RELEASE_VERSION="${RELEASE_TAG#v}"
                  if [ "v${RELEASE_VERSION}" != "$RELEASE_TAG" ]; then
                      echo "Release version ${RELEASE_VERSION} does not match ${RELEASE_TAG}"
                      exit 1
                  fi
                  REMOTE_TAG_REFS="$(git ls-remote --exit-code --tags origin \
                      "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
                  REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                      awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
                  if [ -z "$REMOTE_TAG_SHA" ]; then
                      REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                          awk '$2 !~ /\^\{\}$/ { print $1; exit }')"
                  fi
                  if [ "$REMOTE_TAG_SHA" != "$CHECKED_OUT_SHA" ]; then
                      echo "Remote tag ${RELEASE_TAG} does not resolve to ${CHECKED_OUT_SHA}"
                      exit 1
                  fi
                  {
                      echo "RELEASE_TAG=${RELEASE_TAG}"
                      echo "RELEASE_VERSION=${RELEASE_VERSION}"
                      echo "RELEASE_SHA=${CHECKED_OUT_SHA}"
                  } >> "$GITHUB_ENV"
                  {
                      echo "release_sha=${CHECKED_OUT_SHA}"
                      echo "release_version=${RELEASE_VERSION}"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.19.0
                  registry-url: 'https://registry.npmjs.org'

            - name: Publish kits concurrently
              # Preserve GitHub's authentic dispatch identity for npm OIDC.
              # The checked-out release source is bound separately by the
              # verified tag SHA and exact tarball integrity.
              run: node scripts/publish-kits.js

            - name: Reverify immutable release tag
              if: ${{ always() }}
              run: |
                  set -eu
                  if [ -z "${RELEASE_TAG:-}" ] || [ -z "${RELEASE_SHA:-}" ]; then
                      echo "Skipping tag reverification because immutable source verification did not complete"
                      exit 0
                  fi
                  REMOTE_TAG_REFS="$(git ls-remote --exit-code --tags origin \
                      "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
                  REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                      awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
                  if [ -z "$REMOTE_TAG_SHA" ]; then
                      REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                          awk '$2 !~ /\^\{\}$/ { print $1; exit }')"
                  fi
                  if [ "$REMOTE_TAG_SHA" != "$RELEASE_SHA" ]; then
                      echo "Remote tag ${RELEASE_TAG} moved during kit publication"
                      exit 1
                  fi

            - name: Archive npm failure logs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: failure()
              with:
                  name: npm-logs-publish-kits
                  path: ~/.npm/_logs

    # npm can take several minutes to show a version it has accepted, so a
    # package npm has not confirmed yet is a warning here; a mismatched
    # artifact or dist-tag still fails. Upload and stage V3 candidate waits for
    # this job, and the candidate workflow's release-gate npm parity check reads
    # npm again for up to 10 minutes while a package is still pending.
    audit-kits:
        name: Audit V3 kits on npm
        if: >-
            ${{
                always() &&
                !cancelled() &&
                needs.publish-kits.result == 'success'
            }}
        needs:
            - confirm-staging-branch
            - publish-kits
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            NPM_DIST_TAG: ${{ needs.confirm-staging-branch.outputs.npm_dist_tag }}
            RELEASE_VERSION: ${{ needs.publish-kits.outputs.release_version }}
        steps:
            - name: Checkout the published release source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.publish-kits.outputs.release_sha }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.19.0
                  package-manager-cache: false

            # Recovering a tag cut before the separate audit existed checks out
            # a script that ignores --audit and runs its publish path. That
            # script's publish job audits every package before it succeeds, so
            # here it finds each one already published and re-verifies it. It
            # tries `npm publish` only if npm stops showing a package, and this
            # job has no npm credentials, so that attempt fails; its summary
            # then reads like a failed publish rather than an audit.
            - name: Audit all packages on npm
              run: node scripts/publish-kits.js --audit

    # Packages the bundles the release committed, from a read-only checkout of
    # the verified release tag. Upload and stage V3 candidate depends on it, and
    # a packaging failure fails the release.
    package-v3-candidate:
        name: Package V3 candidate (shadow)
        needs: release
        if: >-
            ${{
                always() &&
                !cancelled() &&
                needs.release.result == 'success' &&
                github.event.inputs.dryRun == 'false' &&
                needs.release.outputs.release_tag != ''
            }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout verified release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ needs.release.outputs.release_tag }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.19.0
                  package-manager-cache: false

            - name: Verify release source
              env:
                  RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
                  RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
                  RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
              run: |
                  set -eu
                  HEAD_SHA="$(git rev-parse HEAD)"
                  TAG_SHA="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
                  if [ "$HEAD_SHA" != "$TAG_SHA" ] || [ "$HEAD_SHA" != "$RELEASE_SHA" ]; then
                      echo "Checked out ${HEAD_SHA}; ${RELEASE_TAG} is ${TAG_SHA} and the release reported ${RELEASE_SHA}"
                      exit 1
                  fi
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  if [ "v${PACKAGE_VERSION}" != "$RELEASE_TAG" ] || [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
                      echo "package.json is ${PACKAGE_VERSION}; expected ${RELEASE_VERSION} for ${RELEASE_TAG}"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Package the release candidate
              env:
                  RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
              run: |
                  node --experimental-strip-types scripts/package-v3-candidate.ts "$RELEASE_VERSION" \
                      --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                      --output out/v3-candidate

            - name: Upload the candidate
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: v3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
                  path: out/v3-candidate
                  if-no-files-found: error
                  retention-days: 7

    # Once the kits are published and audited, dispatches v3-shadow-candidate.yml
    # on main in release-gate mode, which requires npm parity to pass, and waits
    # up to 120 minutes (the child jobs' 110-minute ceiling: resolve 5, verify
    # 25, upload 30, stage 45 and the gate 5, plus 10 minutes of queue time)
    # for the dispatched workflow_run_id to complete with success.
    # A failed status read is retried until the deadline. Every other way this
    # job ends before the child run completes (a failure, the deadline, a
    # timeout or a cancellation) cancels the child run, so a re-run never stages
    # the same build twice in parallel. A refused cancel (a 5xx or rate-limit
    # reply) is retried with a doubling backoff until GitHub accepts it or the
    # child run reads completed, first by the wait step's exit trap and then by
    # the cleanup step. If the dispatch reply is lost or has no workflow_run_id,
    # nothing can cancel the child, so the step names the manual check instead.
    upload-v3-candidate:
        name: Upload and stage V3 candidate
        needs:
            - release
            - package-v3-candidate
            - publish-kits
            - audit-kits
        if: >-
            ${{
                always() &&
                !cancelled() &&
                needs.release.result == 'success' &&
                needs.package-v3-candidate.result == 'success' &&
                needs.publish-kits.result == 'success' &&
                needs.audit-kits.result == 'success' &&
                github.event.inputs.dryRun == 'false' &&
                needs.release.outputs.release_tag != ''
            }}
        runs-on: ubuntu-latest
        timeout-minutes: 130
        permissions:
            actions: write
        steps:
            - name: Dispatch and wait for V3 candidate upload and stage
              id: dispatch
              env:
                  GH_TOKEN: ${{ github.token }}
                  STEP1_RUN_ID: ${{ github.run_id }}
                  WAIT_TIMEOUT_SECONDS: '7200'
                  POLL_INTERVAL_SECONDS: '15'
                  CANCEL_ATTEMPTS: '6'
                  CANCEL_RETRY_SECONDS: '5'
              run: |
                  set -euo pipefail
                  if [[ ! "$STEP1_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
                      echo 'STEP1_RUN_ID must be a workflow run ID.'
                      exit 1
                  fi
                  case "$WAIT_TIMEOUT_SECONDS" in
                      ''|*[!0-9]*|0)
                          echo 'WAIT_TIMEOUT_SECONDS must be a positive integer.'
                          exit 1
                          ;;
                  esac
                  case "$POLL_INTERVAL_SECONDS" in
                      ''|*[!0-9]*|0)
                          echo 'POLL_INTERVAL_SECONDS must be a positive integer.'
                          exit 1
                          ;;
                  esac
                  case "$CANCEL_ATTEMPTS" in
                      ''|*[!0-9]*|0)
                          echo 'CANCEL_ATTEMPTS must be a positive integer.'
                          exit 1
                          ;;
                  esac
                  case "$CANCEL_RETRY_SECONDS" in
                      ''|*[!0-9]*|0)
                          echo 'CANCEL_RETRY_SECONDS must be a positive integer.'
                          exit 1
                          ;;
                  esac
                  # If the dispatch reply is lost or has no workflow_run_id, the
                  # child run may exist with no ID to cancel it by. Its runs
                  # share the gate concurrency group for this Step 1 run, so a
                  # re-run's child queues behind it instead of racing it.
                  UNKNOWN_CHILD="Check the V3 shadow release: upload candidate runs for one dispatched after this Step 1 run started, and cancel it if it is still running, before re-running Step 1."
                  if ! DISPATCH_RESPONSE="$(gh api \
                      --method POST \
                      "repos/${GITHUB_REPOSITORY}/actions/workflows/v3-shadow-candidate.yml/dispatches" \
                      -f ref=main \
                      -f "inputs[step1_run_id]=${STEP1_RUN_ID}" \
                      -f 'inputs[release_gate]=true' \
                      -F return_run_details=true)"; then
                      echo "Dispatch of the V3 candidate upload workflow failed or its reply was lost. ${UNKNOWN_CHILD}"
                      exit 1
                  fi
                  CHILD_RUN_ID="$(printf '%s\n' "$DISPATCH_RESPONSE" | jq -r '.workflow_run_id // empty')"
                  if [[ ! "$CHILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
                      echo "Dispatch did not return a valid workflow_run_id. ${UNKNOWN_CHILD}"
                      exit 1
                  fi
                  echo "child_run_id=${CHILD_RUN_ID}" >> "$GITHUB_OUTPUT"

                  # Retries a refused cancel (a 5xx or rate-limit reply) with a
                  # doubling backoff, CANCEL_ATTEMPTS tries in all, until GitHub
                  # accepts it or the run reads completed. The cleanup step
                  # below carries the same function; keep the two the same.
                  cancel_child() {
                      CANCEL_ATTEMPT=1
                      CANCEL_DELAY="$CANCEL_RETRY_SECONDS"
                      while :; do
                          echo "Cancelling V3 candidate upload workflow run ${CHILD_RUN_ID} (attempt ${CANCEL_ATTEMPT} of ${CANCEL_ATTEMPTS})."
                          if gh api --method POST \
                              "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}/cancel" >/dev/null; then
                              echo "Cancelled V3 candidate upload workflow run ${CHILD_RUN_ID}."
                              return 0
                          fi
                          # GitHub refuses to cancel a completed run.
                          CHILD_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" --jq .status || true)"
                          if [ "$CHILD_STATUS" = 'completed' ]; then
                              echo "V3 candidate upload workflow run ${CHILD_RUN_ID} has already completed."
                              return 0
                          fi
                          if [ "$CANCEL_ATTEMPT" -ge "$CANCEL_ATTEMPTS" ]; then
                              echo "Could not cancel V3 candidate upload workflow run ${CHILD_RUN_ID} after ${CANCEL_ATTEMPTS} attempts (status ${CHILD_STATUS:-unknown})."
                              return 1
                          fi
                          echo "Retrying the cancel in ${CANCEL_DELAY}s (status ${CHILD_STATUS:-unknown})."
                          sleep "$CANCEL_DELAY"
                          CANCEL_DELAY=$((CANCEL_DELAY * 2))
                          CANCEL_ATTEMPT=$((CANCEL_ATTEMPT + 1))
                      done
                  }

                  # Until the child run completes, every exit of this step (the
                  # deadline, an error or a signal) cancels it, so it never goes
                  # on uploading and staging after Step 1 has failed.
                  CHILD_COMPLETED=false
                  on_exit() {
                      EXIT_CODE=$?
                      trap - EXIT
                      if [ "$CHILD_COMPLETED" != 'true' ]; then
                          cancel_child || echo 'The next step tries the cancel again.'
                      fi
                      exit "$EXIT_CODE"
                  }
                  trap on_exit EXIT
                  trap 'exit 130' INT TERM

                  READ_ERRORS="$(mktemp)"
                  HTML_URL=''
                  DEADLINE="$(( $(date +%s) + WAIT_TIMEOUT_SECONDS ))"
                  while :; do
                      # A failed read (a 5xx or rate-limit reply, a dropped
                      # connection, or a reply without the run's status) is
                      # retried until the deadline instead of failing Step 1.
                      if RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" 2>"$READ_ERRORS")" &&
                          STATUS="$(printf '%s\n' "$RUN_JSON" | jq -er '.status | strings')"; then
                          CONCLUSION="$(printf '%s\n' "$RUN_JSON" | jq -r '.conclusion // empty')"
                          HTML_URL="$(printf '%s\n' "$RUN_JSON" | jq -r '.html_url // empty')"
                          if [ "$STATUS" = 'completed' ]; then
                              CHILD_COMPLETED=true
                              echo 'child_completed=true' >> "$GITHUB_OUTPUT"
                              if [ "$CONCLUSION" != 'success' ]; then
                                  echo "V3 candidate upload workflow run ${CHILD_RUN_ID} concluded ${CONCLUSION:-without_success} (${HTML_URL})."
                                  exit 1
                              fi
                              {
                                  printf '## V3 candidate upload and stage\n\n'
                                  printf -- '- Child workflow run: `%s` (%s)\n' "$CHILD_RUN_ID" "$HTML_URL"
                                  printf -- '- Conclusion: `%s`\n' "$CONCLUSION"
                              } >> "$GITHUB_STEP_SUMMARY"
                              break
                          fi
                      else
                          echo "Reading V3 candidate upload workflow run ${CHILD_RUN_ID} failed; retrying until the deadline. $(tail -n 1 "$READ_ERRORS" 2>/dev/null || true)"
                      fi
                      if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                          echo "Timed out after ${WAIT_TIMEOUT_SECONDS}s waiting for V3 candidate upload workflow run ${CHILD_RUN_ID} (${HTML_URL}); cancelling child run."
                          exit 1
                      fi
                      sleep "$POLL_INTERVAL_SECONDS"
                  done

            # Also covers a job timeout or cancellation that stops the wait
            # step before its own exit trap can cancel the child run.
            - name: Cancel V3 candidate workflow if Step 1 fails or is cancelled
              if: ${{ (failure() || cancelled()) && steps.dispatch.outputs.child_run_id != '' && steps.dispatch.outputs.child_completed != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CHILD_RUN_ID: ${{ steps.dispatch.outputs.child_run_id }}
                  CANCEL_ATTEMPTS: '6'
                  CANCEL_RETRY_SECONDS: '5'
              run: |
                  set -eu
                  if [[ ! "$CHILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
                      echo 'CHILD_RUN_ID must be a workflow run ID.'
                      exit 1
                  fi
                  case "$CANCEL_ATTEMPTS" in
                      ''|*[!0-9]*|0)
                          echo 'CANCEL_ATTEMPTS must be a positive integer.'
                          exit 1
                          ;;
                  esac
                  case "$CANCEL_RETRY_SECONDS" in
                      ''|*[!0-9]*|0)
                          echo 'CANCEL_RETRY_SECONDS must be a positive integer.'
                          exit 1
                          ;;
                  esac
                  # The same function as the wait step's. A run the wait step's
                  # exit trap has already cancelled reads completed.
                  cancel_child() {
                      CANCEL_ATTEMPT=1
                      CANCEL_DELAY="$CANCEL_RETRY_SECONDS"
                      while :; do
                          echo "Cancelling V3 candidate upload workflow run ${CHILD_RUN_ID} (attempt ${CANCEL_ATTEMPT} of ${CANCEL_ATTEMPTS})."
                          if gh api --method POST \
                              "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}/cancel" >/dev/null; then
                              echo "Cancelled V3 candidate upload workflow run ${CHILD_RUN_ID}."
                              return 0
                          fi
                          # GitHub refuses to cancel a completed run.
                          CHILD_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" --jq .status || true)"
                          if [ "$CHILD_STATUS" = 'completed' ]; then
                              echo "V3 candidate upload workflow run ${CHILD_RUN_ID} has already completed."
                              return 0
                          fi
                          if [ "$CANCEL_ATTEMPT" -ge "$CANCEL_ATTEMPTS" ]; then
                              echo "Could not cancel V3 candidate upload workflow run ${CHILD_RUN_ID} after ${CANCEL_ATTEMPTS} attempts (status ${CHILD_STATUS:-unknown})."
                              return 1
                          fi
                          echo "Retrying the cancel in ${CANCEL_DELAY}s (status ${CHILD_STATUS:-unknown})."
                          sleep "$CANCEL_DELAY"
                          CANCEL_DELAY=$((CANCEL_DELAY * 2))
                          CANCEL_ATTEMPT=$((CANCEL_ATTEMPT + 1))
                      done
                  }
                  if cancel_child; then
                      exit 0
                  fi
                  echo "Cancel V3 candidate upload workflow run ${CHILD_RUN_ID} before re-running Step 1."
                  exit 1
