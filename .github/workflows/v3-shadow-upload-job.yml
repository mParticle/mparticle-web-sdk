name: 'V3 shadow release: upload job'

# Uploads a verified V3 candidate create-only to each selected pod's bucket.
# Called only by v3-shadow-candidate.yml, after it has validated the Step 1
# run and checked the candidate against the release tag and npm.
#
# The only job in this repository that declares the v3-candidate-upload
# Environment. Each pod's role trusts exactly this job (see the header of
# the calling workflow), through GitHub OIDC claims that AWS STS can check:
#   sub               repo:mParticle/mparticle-web-sdk:environment:v3-candidate-upload
#   job_workflow_ref  mParticle/mparticle-web-sdk/.github/workflows/v3-shadow-upload-job.yml@refs/heads/main
#   repository_id, repository_owner_id  the numeric IDs of this repository
# GitHub sets job_workflow_ref only for a job in a reusable workflow, which
# is why this job lives here and not in its caller. A local `uses:` runs this
# file from the caller's commit, so the ref is the caller's: the default
# branch, which the caller and the Environment's branch rule both require.
# The file has only a workflow_call trigger and cannot be dispatched itself.

on:
    workflow_call:
        inputs:
            run_id:
                description: Step 1 run that holds the candidate artifact
                required: true
                type: string
            artifact_name:
                description: Name of the candidate artifact
                required: true
                type: string
            build_id:
                required: true
                type: string
            version:
                required: true
                type: string
            metadata_sha256:
                required: true
                type: string
            source_sha:
                required: true
                type: string
            pods:
                description: Comma-separated pods
                required: true
                type: string
        # Values come from this job's Environment, but GitHub resolves an
        # Environment secret in a called workflow only for a name the caller
        # passes. Callers pass these names explicitly, never secrets: inherit.
        # A pod with no secrets yet resolves to empty and must not be selected.
        secrets:
            AWS_ROLE_ARN_QA:
                required: false
            AWS_REGION_QA:
                required: false
            AWS_ACCOUNT_ID_QA:
                required: false
            SDK_ARTIFACT_BUCKET_QA:
                required: false
            AWS_ROLE_ARN_US1:
                required: false
            AWS_REGION_US1:
                required: false
            AWS_ACCOUNT_ID_US1:
                required: false
            SDK_ARTIFACT_BUCKET_US1:
                required: false
            AWS_ROLE_ARN_US2:
                required: false
            AWS_REGION_US2:
                required: false
            AWS_ACCOUNT_ID_US2:
                required: false
            SDK_ARTIFACT_BUCKET_US2:
                required: false
            AWS_ROLE_ARN_ST1:
                required: false
            AWS_REGION_ST1:
                required: false
            AWS_ACCOUNT_ID_ST1:
                required: false
            SDK_ARTIFACT_BUCKET_ST1:
                required: false
            AWS_ROLE_ARN_EU1:
                required: false
            AWS_REGION_EU1:
                required: false
            AWS_ACCOUNT_ID_EU1:
                required: false
            SDK_ARTIFACT_BUCKET_EU1:
                required: false
            AWS_ROLE_ARN_AU1:
                required: false
            AWS_REGION_AU1:
                required: false
            AWS_ACCOUNT_ID_AU1:
                required: false
            SDK_ARTIFACT_BUCKET_AU1:
                required: false

permissions: {}

jobs:
    upload:
        name: Upload the candidate (shadow)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: v3-candidate-upload
        permissions:
            actions: read # Download the artifact of the Step 1 run.
            contents: read
            id-token: write # Exchange OIDC for short-lived AWS credentials per pod.
        env:
            AWS_PAGER: ''
            BUILD_ID: ${{ inputs.build_id }}
            CANDIDATE_VERSION: ${{ inputs.version }}
            METADATA_SHA256: ${{ inputs.metadata_sha256 }}
            SOURCE_SHA: ${{ inputs.source_sha }}
        steps:
            - name: Checkout the default branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 1
                  ref: ${{ github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.19.0
                  package-manager-cache: false

            - name: Require the default branch definition
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -eu
                  if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
                      echo 'Shadow release workflows run only from the default branch.'
                      exit 1
                  fi

            - name: Select pods
              id: pods
              env:
                  POD_LIST: ${{ inputs.pods }}
              run: |
                  set -euo pipefail
                  node --experimental-strip-types scripts/v3-release/shadow-release-trigger.ts pods \
                      --list "$POD_LIST" | tee -a "$GITHUB_OUTPUT"

            - name: Download the candidate from the Step 1 run
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ inputs.artifact_name }}
                  run-id: ${{ inputs.run_id }}
                  github-token: ${{ github.token }}
                  path: ${{ runner.temp }}/v3-candidate

            - name: Re-validate the candidate after the job boundary
              run: |
                  set -eu
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --dry-run > /dev/null

            - name: Configure AWS credentials (qa)
              if: ${{ steps.pods.outputs.qa == 'true' }}
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN_QA }}
                  role-session-name: v3-shadow-upload-qa-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION_QA }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID_QA }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload the candidate (qa)
              if: ${{ steps.pods.outputs.qa == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_QA }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET_QA }}
              run: |
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --pod qa \
                      --progress-file "$RUNNER_TEMP/v3-release-progress.jsonl"

            - name: Configure AWS credentials (us1)
              if: ${{ steps.pods.outputs.us1 == 'true' }}
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN_US1 }}
                  role-session-name: v3-shadow-upload-us1-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION_US1 }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID_US1 }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload the candidate (us1)
              if: ${{ steps.pods.outputs.us1 == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_US1 }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET_US1 }}
              run: |
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --pod us1 \
                      --progress-file "$RUNNER_TEMP/v3-release-progress.jsonl"

            - name: Configure AWS credentials (us2)
              if: ${{ steps.pods.outputs.us2 == 'true' }}
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN_US2 }}
                  role-session-name: v3-shadow-upload-us2-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION_US2 }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID_US2 }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload the candidate (us2)
              if: ${{ steps.pods.outputs.us2 == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_US2 }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET_US2 }}
              run: |
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --pod us2 \
                      --progress-file "$RUNNER_TEMP/v3-release-progress.jsonl"

            - name: Configure AWS credentials (st1)
              if: ${{ steps.pods.outputs.st1 == 'true' }}
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN_ST1 }}
                  role-session-name: v3-shadow-upload-st1-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION_ST1 }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID_ST1 }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload the candidate (st1)
              if: ${{ steps.pods.outputs.st1 == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_ST1 }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET_ST1 }}
              run: |
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --pod st1 \
                      --progress-file "$RUNNER_TEMP/v3-release-progress.jsonl"

            - name: Configure AWS credentials (eu1)
              if: ${{ steps.pods.outputs.eu1 == 'true' }}
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN_EU1 }}
                  role-session-name: v3-shadow-upload-eu1-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION_EU1 }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID_EU1 }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload the candidate (eu1)
              if: ${{ steps.pods.outputs.eu1 == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_EU1 }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET_EU1 }}
              run: |
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --pod eu1 \
                      --progress-file "$RUNNER_TEMP/v3-release-progress.jsonl"

            - name: Configure AWS credentials (au1)
              if: ${{ steps.pods.outputs.au1 == 'true' }}
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN_AU1 }}
                  role-session-name: v3-shadow-upload-au1-${{ github.run_id }}-${{ github.run_attempt }}
                  aws-region: ${{ secrets.AWS_REGION_AU1 }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID_AU1 }}
                  mask-aws-account-id: true
                  unset-current-credentials: true

            - name: Upload the candidate (au1)
              if: ${{ steps.pods.outputs.au1 == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_AU1 }}
                  SDK_ARTIFACT_BUCKET: ${{ secrets.SDK_ARTIFACT_BUCKET_AU1 }}
              run: |
                  node --experimental-strip-types scripts/v3-release/upload-v3-candidate.ts \
                      --candidate "$RUNNER_TEMP/v3-candidate" \
                      --expected-version "$CANDIDATE_VERSION" \
                      --expected-build-id "$BUILD_ID" \
                      --expected-metadata-sha256 "$METADATA_SHA256" \
                      --expected-source-sha "$SOURCE_SHA" \
                      --pod au1 \
                      --progress-file "$RUNNER_TEMP/v3-release-progress.jsonl"

            - name: Summarize pods
              if: ${{ always() }}
              env:
                  PODS: ${{ steps.pods.outputs.pods }}
              run: |
                  set -eu
                  STATUS=0
                  node --experimental-strip-types scripts/v3-release/release-progress.ts \
                      --file "$RUNNER_TEMP/v3-release-progress.jsonl" \
                      --pods "$PODS" > "$RUNNER_TEMP/v3-release-summary.md" || STATUS=$?
                  {
                      echo '### V3 shadow candidate upload'
                      echo
                      cat "$RUNNER_TEMP/v3-release-summary.md"
                  } >> "$GITHUB_STEP_SUMMARY"
                  cat "$RUNNER_TEMP/v3-release-summary.md"
                  exit "$STATUS"
