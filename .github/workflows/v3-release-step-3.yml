name: "V3 Release - Step 3: Release to CDN and Synchronize Branches"
run-name: 'V3 Release - Step 3 [${{ inputs.releaseTag }}]'

# The V3 release, Step 3. V2 releases with staging-step-3.yml.
#
# In Release Please mode (repository variable V3_RELEASE_PLEASE_ENABLED is
# 'true'), Release Please cuts the tag from main and v3-development is retired,
# so Step 3 pushes only the three release-order branches. It then requires the
# tag's commit to be on main. Otherwise it pushes all five branches, as before.
#
# A dry run never loads the release machine user's token: it checks out and
# reads origin with the job's read-only GITHUB_TOKEN. A real run first checks
# that the token is set, and fails at the start if it is empty. Right before
# the atomic push, a real run reads the tag on origin again and stops if it no
# longer names the commit the preflight checked.

on:
    workflow_dispatch:
        inputs:
            releaseTag:
                description: 'Semantic-release candidate tag (for example, v3.0.1)'
                required: true
                type: string
            dryRun:
                description: 'Do a dry run to validate without pushing [true/false]'
                required: true
                type: boolean
                default: true

permissions: {}

jobs:
    synchronize-branches:
      name: Synchronize exact candidate ${{ inputs.releaseTag }}
      runs-on: ubuntu-latest
      permissions:
        contents: read # A real run pushes with the machine user's token, not GITHUB_TOKEN.
      env:
        GITHUB_TOKEN: ${{ github.event.inputs.dryRun == 'false' && secrets.MP_SEMANTIC_RELEASE_BOT || github.token }}
        GIT_AUTHOR_NAME: mparticle-automation
        GIT_AUTHOR_EMAIL: developers@mparticle.com
        GIT_COMMITTER_NAME: mparticle-automation
        GIT_COMMITTER_EMAIL: developers@mparticle.com

      steps:
        # An empty secret would fall back to the read-only job token above, and
        # the real run would fail only at the push. Stop at the start instead.
        - name: Check the release token on a real run
          if: ${{ github.event.inputs.dryRun == 'false' }}
          env:
            RELEASE_TOKEN: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
          run: |
            set -eu
            if [ -z "${RELEASE_TOKEN:-}" ]; then
              echo "::error title=Release token missing::MP_SEMANTIC_RELEASE_BOT is empty or not available to this workflow. A real run needs it to push the release branches. Set the secret, or run with dryRun true. Nothing was checked out or pushed."
              exit 1
            fi

        - name: Checkout repository
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
          with:
            fetch-depth: 0
            repository: ${{ github.repository }}
            # Only a real run pushes, so only a real run loads the release token.
            token: ${{ github.event.inputs.dryRun == 'false' && secrets.MP_SEMANTIC_RELEASE_BOT || github.token }}

        - name: Validate workflow source
          env:
            SOURCE_REF: ${{ github.ref }}
            RELEASE_TAG: ${{ inputs.releaseTag }}
          run: |
            set -eu
            case "$SOURCE_REF" in
              refs/heads/main) ;;
              *)
                echo "V3 release workflows require source ref refs/heads/main; received ${SOURCE_REF}"
                exit 1
                ;;
            esac

            # Only the V3 trunk's copy of this workflow synchronizes, dry runs
            # included. The candidate must also have package.json equal to the
            # tag. V2 releases use staging-step-3.yml from master.
            if [[ ! "$RELEASE_TAG" =~ ^v3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Invalid stable V3 release tag: ${RELEASE_TAG}"
              exit 1
            fi

        - name: Setup Node.js
          uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
          with:
            node-version: 24.x

        - name: Resolve and preflight release candidate
          id: candidate
          env:
            RELEASE_TAG: ${{ inputs.releaseTag }}
            RELEASE_PLEASE_ENABLED: ${{ vars.V3_RELEASE_PLEASE_ENABLED }}
          run: |
            set -eu
            if ! printf '%s\n' "$RELEASE_TAG" |
                grep -Eq '^v3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "Invalid stable release tag: $RELEASE_TAG"
              exit 1
            fi

            git tag -d "$RELEASE_TAG" >/dev/null 2>&1 || true
            git fetch --no-tags --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            CANDIDATE_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"

            REMOTE_TAG_REFS="$(git ls-remote --exit-code --tags origin \
              "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
            REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
              awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [ -z "$REMOTE_TAG_SHA" ]; then
              REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                awk '$2 !~ /\^\{\}$/ { print $1; exit }')"
            fi
            if [ "$REMOTE_TAG_SHA" != "$CANDIDATE_SHA" ]; then
              echo "Fetched tag does not match the remote peeled commit"
              exit 1
            fi

            git checkout --detach "$CANDIDATE_SHA"
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            if [ "v${PACKAGE_VERSION}" != "$RELEASE_TAG" ]; then
              echo "package.json version ${PACKAGE_VERSION} does not match ${RELEASE_TAG}"
              exit 1
            fi
            PACKAGE_MAJOR="${PACKAGE_VERSION%%.*}"
            case "$PACKAGE_MAJOR" in
              3)
                TRACK="v3"
                STAGING_BRANCH="v3-staging"
                DEVELOPMENT_BRANCH="v3-development"
                TRUNK_BRANCH="main"
                RELEASE_ORDER_A_BRANCH="v3-release-order-a"
                RELEASE_ORDER_B_BRANCH="v3-release-order-b"
                RELEASE_ORDER_C_BRANCH="v3-release-order-c"
                ;;
              *) exit 1 ;;
            esac
            MAPPING="${TRACK}|${STAGING_BRANCH}|${DEVELOPMENT_BRANCH}|${TRUNK_BRANCH}|${RELEASE_ORDER_A_BRANCH}|${RELEASE_ORDER_B_BRANCH}|${RELEASE_ORDER_C_BRANCH}"
            case "$MAPPING" in
              "v3|v3-staging|v3-development|main|v3-release-order-a|v3-release-order-b|v3-release-order-c") ;;
              *) exit 1 ;;
            esac

            STAGING_SHA="$(git ls-remote --exit-code origin \
              "refs/heads/${STAGING_BRANCH}" | awk 'NR == 1 { print $1 }')"
            if [ "$STAGING_SHA" != "$CANDIDATE_SHA" ]; then
              echo "${RELEASE_TAG} is stale: origin/${STAGING_BRANCH} is ${STAGING_SHA}"
              exit 1
            fi

            if [ "$RELEASE_PLEASE_ENABLED" = "true" ]; then
              RELEASE_PLEASE_MODE=true
              # Release Please cuts every V3 tag from main, which already
              # holds the release, and v3-development is retired.
              git fetch --no-tags --force origin \
                "refs/heads/${TRUNK_BRANCH}:refs/remotes/origin/${TRUNK_BRANCH}"
              if ! git merge-base --is-ancestor "$CANDIDATE_SHA" \
                "refs/remotes/origin/${TRUNK_BRANCH}"; then
                echo "${RELEASE_TAG} is not on origin/${TRUNK_BRANCH}; Release Please cuts V3 tags from ${TRUNK_BRANCH}"
                exit 1
              fi
              set -- \
                "$RELEASE_ORDER_A_BRANCH" \
                "$RELEASE_ORDER_B_BRANCH" \
                "$RELEASE_ORDER_C_BRANCH"
            else
              RELEASE_PLEASE_MODE=false
              set -- \
                "$DEVELOPMENT_BRANCH" \
                "$TRUNK_BRANCH" \
                "$RELEASE_ORDER_A_BRANCH" \
                "$RELEASE_ORDER_B_BRANCH" \
                "$RELEASE_ORDER_C_BRANCH"
            fi

            for DESTINATION in "$@"; do
              DESTINATION_SHA="$(git ls-remote --exit-code origin \
                "refs/heads/${DESTINATION}" | awk 'NR == 1 { print $1 }')"
              git fetch --no-tags --force origin \
                "refs/heads/${DESTINATION}:refs/remotes/origin/${DESTINATION}"
              if [ "$DESTINATION_SHA" = "$CANDIDATE_SHA" ]; then
                continue
              fi
              if ! git merge-base --is-ancestor "$DESTINATION_SHA" "$CANDIDATE_SHA"; then
                echo "origin/${DESTINATION} cannot fast-forward to ${RELEASE_TAG}"
                exit 1
              fi
            done

            echo "track=$TRACK" >> "$GITHUB_OUTPUT"
            echo "release_please_mode=$RELEASE_PLEASE_MODE" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "development_branch=$DEVELOPMENT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "trunk_branch=$TRUNK_BRANCH" >> "$GITHUB_OUTPUT"
            echo "release_order_a_branch=$RELEASE_ORDER_A_BRANCH" >> "$GITHUB_OUTPUT"
            echo "release_order_b_branch=$RELEASE_ORDER_B_BRANCH" >> "$GITHUB_OUTPUT"
            echo "release_order_c_branch=$RELEASE_ORDER_C_BRANCH" >> "$GITHUB_OUTPUT"

        - name: Atomically synchronize all destinations
          if: ${{ github.event.inputs.dryRun == 'false' }}
          env:
            RELEASE_TAG: ${{ inputs.releaseTag }}
            CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
            RELEASE_PLEASE_MODE: ${{ steps.candidate.outputs.release_please_mode }}
            DEVELOPMENT_BRANCH: ${{ steps.candidate.outputs.development_branch }}
            TRUNK_BRANCH: ${{ steps.candidate.outputs.trunk_branch }}
            RELEASE_ORDER_A_BRANCH: ${{ steps.candidate.outputs.release_order_a_branch }}
            RELEASE_ORDER_B_BRANCH: ${{ steps.candidate.outputs.release_order_b_branch }}
            RELEASE_ORDER_C_BRANCH: ${{ steps.candidate.outputs.release_order_c_branch }}
          run: |
            set -eu
            # The preflight checked the tag's commit. Read the tag on origin
            # again right before the push, so a tag moved since then stops
            # the run with no branch moved.
            if ! REMOTE_TAG_REFS="$(git ls-remote --exit-code --tags origin \
                "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"; then
              echo "${RELEASE_TAG} is no longer on origin; nothing was pushed"
              exit 1
            fi
            REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
              awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [ -z "$REMOTE_TAG_SHA" ]; then
              REMOTE_TAG_SHA="$(printf '%s\n' "$REMOTE_TAG_REFS" |
                awk '$2 !~ /\^\{\}$/ { print $1; exit }')"
            fi
            if [ "$REMOTE_TAG_SHA" != "$CANDIDATE_SHA" ]; then
              echo "${RELEASE_TAG} now resolves to ${REMOTE_TAG_SHA} on origin, not the checked candidate ${CANDIDATE_SHA}; nothing was pushed"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]; then
              echo "HEAD is not the checked candidate ${CANDIDATE_SHA}; nothing was pushed"
              exit 1
            fi
            if [ "$RELEASE_PLEASE_MODE" = "true" ]; then
              git push --atomic origin \
                "HEAD:refs/heads/${RELEASE_ORDER_A_BRANCH}" \
                "HEAD:refs/heads/${RELEASE_ORDER_B_BRANCH}" \
                "HEAD:refs/heads/${RELEASE_ORDER_C_BRANCH}"
            else
              git push --atomic origin \
                "HEAD:refs/heads/${DEVELOPMENT_BRANCH}" \
                "HEAD:refs/heads/${TRUNK_BRANCH}" \
                "HEAD:refs/heads/${RELEASE_ORDER_A_BRANCH}" \
                "HEAD:refs/heads/${RELEASE_ORDER_B_BRANCH}" \
                "HEAD:refs/heads/${RELEASE_ORDER_C_BRANCH}"
            fi

        - name: Report synchronized release
          env:
            RELEASE_TAG: ${{ inputs.releaseTag }}
            TRACK: ${{ steps.candidate.outputs.track }}
            CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
            DEVELOPMENT_BRANCH: ${{ steps.candidate.outputs.development_branch }}
            TRUNK_BRANCH: ${{ steps.candidate.outputs.trunk_branch }}
            RELEASE_ORDER_A_BRANCH: ${{ steps.candidate.outputs.release_order_a_branch }}
            RELEASE_ORDER_B_BRANCH: ${{ steps.candidate.outputs.release_order_b_branch }}
            RELEASE_ORDER_C_BRANCH: ${{ steps.candidate.outputs.release_order_c_branch }}
            RELEASE_PLEASE_MODE: ${{ steps.candidate.outputs.release_please_mode }}
            DRY_RUN: ${{ github.event.inputs.dryRun }}
            SOURCE_REF: ${{ github.ref }}
          run: |
            set -eu
            if [ "$DRY_RUN" = "true" ]; then
              ACTION="Would run atomic push"
            else
              ACTION="Completed atomic push"
            fi
            if [ "$RELEASE_PLEASE_MODE" = "true" ]; then
              set -- "$RELEASE_ORDER_A_BRANCH" "$RELEASE_ORDER_B_BRANCH" \
                "$RELEASE_ORDER_C_BRANCH"
            else
              set -- "$DEVELOPMENT_BRANCH" "$TRUNK_BRANCH" \
                "$RELEASE_ORDER_A_BRANCH" "$RELEASE_ORDER_B_BRANCH" \
                "$RELEASE_ORDER_C_BRANCH"
            fi
            {
              printf '## Release synchronization\n\n'
              printf -- '- Release tag: `%s`\n' "$RELEASE_TAG"
              printf -- '- Source ref: `%s`\n' "$SOURCE_REF"
              printf -- '- Track: `%s`\n' "$TRACK"
              printf -- '- Candidate SHA: `%s`\n' "$CANDIDATE_SHA"
              printf -- '- Release Please mode: `%s`\n' "$RELEASE_PLEASE_MODE"
              printf -- '- Dry run: `%s`\n' "$DRY_RUN"
              printf -- '- Action: `%s`\n' "$ACTION"
              printf -- '- Destinations:'
              printf ' `%s`' "$@"
              printf '\n\n### Atomic command\n\n```sh\n'
              printf 'git push --atomic origin'
              printf ' \\\n  HEAD:refs/heads/%s' "$@"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
