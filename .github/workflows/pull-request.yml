# This Github Workflow builds v2 of the mParticle Web SDK, lints with ESLint and Prettier to find errors, and runs all tests
# If the PR is from dependabot, it automatically gets merged if tests run properly.

name: Web SDK Build & Test

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
    build-bundle:
        name: Build Distribution Bundle
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Run NPM CI
              run: npm ci

            - name: Lint with ESLint
              run: npm run lint

            - name: Lint with Prettier
              run: npm run prettier

            - name: Run Build IIFE
              run: npm run build:iife

            - name: Display Bundle Diff, but Fancy!
              run: git diff --unified=3 dist/mparticle.js | npx diff-so-fancy

            - name: Archive Bundle
              uses: actions/upload-artifact@v6
              with:
                  name: bundle-local
                  path: dist

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    # Currently, we're only using Jest to test TypeScript modules
    # and they do not require any built files
    test-jest:
        name: 'Test Jest'
        runs-on: 'ubuntu-latest'
        strategy:
            matrix:
                node-version: [18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Run NPM CI
              run: npm ci

            - name: Run Jest Tests
              run: npm run test:jest

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    # Only Core test requires bundle, but we want to make sure
    # that tests only run when the bundle is successfully built
    test-core:
        name: Core Tests
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-jest
            - build-bundle
        with:
            test_command_label: Core SDK Tests
            test_command: npm run test
            build_command: npm run build:iife
            branch_name: ${{ vars.GITHUB_SHA }}

    # Kit tests: build and test each kit defined in kits/matrix.json
    load-kit-matrix:
        name: Load Kit Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set.outputs.matrix }}
        steps:
            - uses: actions/checkout@v6
            - id: set
              run: |
                if [ -f kits/matrix.json ]; then
                  echo "matrix=$(jq -c . kits/matrix.json)" >> "$GITHUB_OUTPUT"
                else
                  echo "matrix=[]" >> "$GITHUB_OUTPUT"
                fi

    run-kit-tests:
        name: 'Kit Tests: ${{ matrix.kit.name }}'
        needs:
            - load-kit-matrix
            - test-jest
            - build-bundle
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                kit: ${{ fromJson(needs.load-kit-matrix.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@latest

            - name: Install, build, and test kit
              run: |
                cd ${{ matrix.kit.local_path }}
                npm ci
                npm run build
                npm test

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs-kit-${{ matrix.kit.name }}
                  path: ~/.npm/_logs

    # Coverage is uploaded separately so instrumentation can't affect the
    # assertions in the test jobs above. Needs a CODECOV_TOKEN secret.
    coverage-core:
        name: Core Coverage
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - name: Run NPM CI
              run: npm ci

            - name: Run Jest Tests with Coverage
              run: npm run test:jest:coverage

            - name: Upload Core Coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  flags: core

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs-coverage-core
                  path: ~/.npm/_logs

    coverage-rokt-kit:
        name: Rokt Kit Coverage
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            - name: Run NPM CI
              working-directory: kits/rokt
              run: npm ci

            - name: Run Vitest with Coverage
              working-directory: kits/rokt
              run: npm run test:coverage

            # Vitest emits kit-relative paths; Codecov needs repo-relative.
            - name: Re-root coverage paths onto the repository root
              run: sed -i 's|^SF:|SF:kits/rokt/|' kits/rokt/coverage/lcov.info

            - name: Upload Rokt Kit Coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./kits/rokt/coverage/lcov.info
                  flags: rokt-kit

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs-coverage-rokt-kit
                  path: ~/.npm/_logs

    # Test Stub can be run independent of other tests
    test-stub:
        name: 'Test Stub'
        runs-on: ubuntu-latest
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Run NPM CI
              run: npm ci

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@latest

            - name: Log Firefox Version
              run: firefox --version

            - name: Run Stub Tests
              run: npm run test:stub

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    # Integration Tests run the same suite of tests against various build systems
    # to make sure our SDK will run in different environments

    test-integrations-require-js:
        name: 'Integration Tests: Require JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        with:
            test_command_label: Require JS Test
            test_command: npm run test:requirejs
            branch_name: ${{ vars.GITHUB_SHA }}

    test-integrations-common-js-browserfy:
        name: 'Integration Tests: Browserfy Common JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        with:
            test_command_label: Browserfy CJS Test
            test_command: npm run test:integrations:cjs:browserfy
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-common-js-webpack:
        name: 'Integration Tests: webpack Common JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        with:
            test_command_label: webpack CJS Test
            test_command: npm run test:integrations:cjs:webpack
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-common-js-rollup:
        name: 'Integration Tests: Rollup Common JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        with:
            test_command_label: Rollup CJS Test
            test_command: npm run test:integrations:cjs:rollup
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-module-js-webpack:
        name: 'Integration Tests: webpack Module JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        with:
            test_command_label: webpack Module Test
            test_command: npm run test:integrations:module:webpack
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:esm && npm run build:test-bundle

    test-integrations-module-js-rollup:
        name: 'Integration Tests: Rollup Module JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - run-kit-tests
            - test-jest
            - build-bundle
        with:
            test_command_label: Rollup Module Test
            test_command: npm run test:integrations:module:rollup
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:esm && npm run build:test-bundle

    # Reports how this PR moves the size of the bundles a consumer actually downloads.
    # Both sides are built from source in this job — the PR head and the commit the PR
    # is based on — so the two numbers come from one toolchain and one bundle list.
    # Report only: continue-on-error, so it can never gate a merge.
    bundle-size:
        name: Bundle Size
        runs-on: ubuntu-latest
        continue-on-error: true
        # Gates on lint and the IIFE build only; this job rebuilds everything itself and
        # uses none of build-bundle's artifacts.
        needs: build-bundle
        permissions:
            contents: read
            pull-requests: write
        steps:
            # head.sha, not the default merge ref, so the commit measured is the commit
            # the report names — and the delta is this PR's own, not the base's drift.
            - name: Checkout PR
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: pr
                  persist-credentials: false

            # base.sha rather than the base branch tip, so the comparison does not
            # shift underneath the PR when someone else merges to the base branch.
            - name: Checkout Base
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base
                  persist-credentials: false

            - name: NPM install
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x

            # Both build steps continue on error: a side that fails to build renders as
            # `not built` rather than silently leaving a stale comment from a past run.
            - name: Build PR Bundles
              continue-on-error: true
              working-directory: pr
              run: bash scripts/bundle-size/build-bundles.sh

            # The base commit predates this check, so it is built and measured with the
            # PR's script and tracked-bundle list, never its own.
            - name: Build Base Bundles
              continue-on-error: true
              working-directory: base
              run: bash ../pr/scripts/bundle-size/build-bundles.sh

            - name: Measure Base Bundles
              continue-on-error: true
              run: node pr/scripts/bundle-size/report.js --cwd base --out base-bundle-size.json > /dev/null

            # Branch names are contributor-controlled, so the labels are passed through
            # the environment rather than interpolated into the shell.
            - name: Render Report
              continue-on-error: true
              env:
                  BASE_LABEL: ${{ github.event.pull_request.base.ref }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  node pr/scripts/bundle-size/report.js \
                      --cwd pr \
                      --baseline base-bundle-size.json \
                      --base-label "$BASE_LABEL" \
                      --head-label 'this PR' \
                      --base-sha "$BASE_SHA" \
                      --head-sha "$HEAD_SHA" \
                      --run-url "$RUN_URL" \
                      > bundle-size-report.md
                  cat bundle-size-report.md >> "$GITHUB_STEP_SUMMARY"

            # Forks get a read-only token, so the comment is best-effort; the step
            # summary above is the fallback.
            - name: Post Sticky Comment
              if: always()
              continue-on-error: true
              uses: actions/github-script@v8
              with:
                  script: |
                      const { existsSync, readFileSync } = require('fs');

                      // Duplicated from scripts/bundle-size/report.js on purpose, and
                      // NOT require()d from the pr/ checkout: that is PR-author code,
                      // and requiring it would execute it inside this authenticated
                      // step. report.test.js asserts the two copies stay in step.
                      const STICKY_MARKER = '<!-- bundle-size-report -->';

                      // The redirect in Render Report creates the file up front, so an
                      // empty file — not a missing one — is what a failure looks like.
                      const body = existsSync('bundle-size-report.md')
                          ? readFileSync('bundle-size-report.md', 'utf8')
                          : '';
                      if (!body.trim()) {
                          core.warning('No report was rendered; leaving the PR comment untouched.');
                          return;
                      }
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;

                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner,
                          repo,
                          issue_number,
                          per_page: 100,
                      });
                      const existing = comments.find(
                          comment =>
                              comment.user.type === 'Bot' &&
                              (comment.body || '').includes(STICKY_MARKER)
                      );

                      if (existing) {
                          await github.rest.issues.updateComment({
                              owner,
                              repo,
                              comment_id: existing.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }

            - name: Archive Bundle Size Measurements
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: bundle-size
                  path: |
                      bundle-size-report.md
                      base-bundle-size.json

    automerge-dependabot:
        name: 'Save PR Number for Dependabot Automerge'
        needs:
            - test-core
            - test-stub
            - run-kit-tests
            - test-integrations-common-js-browserfy
            - test-integrations-common-js-webpack
            - test-integrations-common-js-rollup
            - test-integrations-module-js-webpack
            - test-integrations-module-js-rollup
            - test-integrations-require-js
        uses: mParticle/mparticle-workflows/.github/workflows/dependabot-save-pr-number.yml@main

    pr-notify:
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        needs:
            - test-stub
            - test-integrations-require-js
            - test-integrations-common-js-browserfy
            - test-integrations-common-js-webpack
            - test-integrations-common-js-rollup
            - test-integrations-module-js-webpack
            - test-integrations-module-js-rollup
        name: Notify GChat
        uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@main
        secrets:
            gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}
