# This Github Workflow builds v2 of the mParticle Web SDK, lints with ESLint and Prettier to find errors, and runs all tests

name: Web SDK Build & Test

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
    build-bundle:
        name: Build Distribution Bundle
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: latest

            - name: Run NPM CI
              run: npm ci

            - name: Lint with ESLint
              run: npm run lint

            - name: Lint with Prettier
              run: npm run prettier

            - name: Run Build IIFE
              run: npm run build:iife

            - name: Display Bundle Diff, but Fancy!
              run: git diff --unified=3 dist/mparticle.js | npx --yes diff-so-fancy@1.4.12

            - name: Archive Bundle
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: bundle-local
                  path: dist

            - name: Archive unminified core bundle for the CDN minifier check
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: cdn-minifier-input-core
                  path: cdn-minifier-input
                  if-no-files-found: error

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    # Currently, we're only using Jest to test TypeScript modules
    # and they do not require any built files
    test-jest:
        name: 'Test Jest'
        runs-on: 'ubuntu-latest'
        strategy:
            matrix:
                node-version: [18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Run NPM CI
              run: npm ci

            - name: Run Jest Tests
              run: npm run test:jest

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    # Only Core test requires bundle, but we want to make sure
    # that tests only run when the bundle is successfully built
    test-core:
        name: Core Tests
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-jest
            - build-bundle
        with:
            test_command_label: Core SDK Tests
            test_command: npm run test
            build_command: npm run build:iife
            branch_name: ${{ vars.GITHUB_SHA }}

    # The lean SDK plus every module, as the server joins them, against the
    # whole suite; and the lean SDK alone against the suites that expect no module.
    test-modular:
        name: Modular Tests
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-jest
            - build-bundle
        with:
            test_command_label: Lean SDK plus modules
            test_command: npm run test:modular
            build_command: npm run build:modular
            branch_name: ${{ vars.GITHUB_SHA }}

    test-lean:
        name: Lean SDK Tests
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-jest
            - build-bundle
        with:
            test_command_label: Lean SDK without modules
            test_command: npm run test:lean
            build_command: npm run build:modular
            branch_name: ${{ vars.GITHUB_SHA }}

    # Kit tests: build and test each kit defined in kits/matrix.json
    load-kit-matrix:
        name: Load Kit Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set.outputs.matrix }}
        steps:
            - uses: actions/checkout@v6
            - id: set
              run: |
                if [ -f kits/matrix.json ]; then
                  echo "matrix=$(jq -c . kits/matrix.json)" >> "$GITHUB_OUTPUT"
                else
                  echo "matrix=[]" >> "$GITHUB_OUTPUT"
                fi

    # The slowest kit normally finishes in under 2 minutes (Adobe ~1m47s,
    # Google Analytics 4 ~1m31s, Braze 4 ~1m14s, Rokt ~1m08s; worst-case
    # npm/Firefox/Karma startup ~4-6 minutes), so 15 minutes leaves ample
    # margin while stopping a Karma/Firefox hang from running for 6 hours.
    run-kit-tests:
        name: 'Kit Tests: ${{ matrix.kit.name }}'
        needs:
            - load-kit-matrix
            - test-jest
            - build-bundle
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                kit: ${{ fromJson(needs.load-kit-matrix.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: latest

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@latest

            - name: Install, build, and test kit
              env:
                  KIT_PATH: ${{ matrix.kit.local_path }}
              run: |
                cd "$KIT_PATH"
                npm ci
                npm run build
                npm test

            - name: Collect kit bundles for the CDN minifier check
              env:
                  KIT_PATH: ${{ matrix.kit.local_path }}
              run: |
                  find "$KIT_PATH" -path '*/node_modules' -prune -o -path '*/dist/*.iife.js' -print |
                  while read -r bundle; do
                      mkdir -p "cdn-minifier-input/$(dirname "$bundle")"
                      cp "$bundle" "cdn-minifier-input/$bundle"
                  done

            - name: Archive kit bundles for the CDN minifier check
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: cdn-minifier-input-${{ strategy.job-index }}
                  path: cdn-minifier-input
                  if-no-files-found: error

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs-kit-${{ matrix.kit.name }}
                  path: ~/.npm/_logs

    # Smoke-tests the minified core and kit IIFE bundles against their unminified siblings, and
    # checks that they survive the mParticle CDN's NUglify pass until the CDN stops re-minifying.
    cdn-minifier-check:
        name: CDN Minifier Check
        needs:
            - build-bundle
            - run-kit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: latest

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Run NPM CI
              run: npm ci

            # NUglify 1.20.7 dropped the constant named by a computed key in a destructuring pattern (the 3.19.0
            # break). From 1.21.18 the minifier keeps it, so this fixture must now pass. The detector itself is
            # covered by test/jest/cdn-minifier-check.spec.ts.
            - name: Confirm the minifier keeps the 3.19.0 pattern
              run: node scripts/check-cdn-minifier.js test/fixtures/cdn-minifier/computed-binding-key.js

            # NUglify writes a string escape back out as the raw character, so 3.33.0's checkout pattern
            # left the served bundle non-ASCII and Shift_JIS pages could not parse it. The check must keep
            # failing on that pattern; if it stops, it no longer sees what NUglify does to escapes.
            - name: Confirm the ASCII check catches the 3.33.0 pattern
              run: |
                  if output=$(node scripts/check-cdn-minifier.js test/fixtures/cdn-minifier/escaped-non-ascii-string.js 2>&1); then
                      echo "$output"
                      echo "::error::The CDN minifier check passed a bundle NUglify leaves non-ASCII."
                      exit 1
                  fi
                  echo "$output"
                  echo "$output" | grep -q 'is not ASCII after minification'

            - name: Download core bundle
              uses: actions/download-artifact@v8
              with:
                  name: bundle-local
                  path: cdn-minifier-input/dist

            - name: Download kit bundles
              uses: actions/download-artifact@v8
              with:
                  pattern: cdn-minifier-input-*
                  merge-multiple: true
                  path: cdn-minifier-input

            - name: Smoke-test minified CDN bundles
              working-directory: cdn-minifier-input
              run: |
                  { echo dist/mparticle.js; find kits -name '*.iife.js'; } |
                  xargs node ../scripts/smoke-cdn-minified.js

            - name: Check bundles survive the CDN minifier
              working-directory: cdn-minifier-input
              run: |
                  { echo dist/mparticle.js; find kits -name '*.iife.js'; } |
                  xargs node ../scripts/check-cdn-minifier.js

    # Report-only: core and the Rokt kit as the CDN serves them, for this pull request merged onto its base and for
    # that base, so the difference is this pull request's own.
    cdn-bundle-size:
        name: CDN-Shaped Bundle Size
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 2
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x

            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: 8.0.x

            # Both sides build with this pull request's script, which drops any bundle whose build fails.
            - name: Build this pull request's bundles
              run: bash scripts/cdn-bundle-size-build.sh

            - name: Build the base's bundles
              continue-on-error: true
              run: |
                  git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
                  cd "$RUNNER_TEMP/base"
                  bash "$GITHUB_WORKSPACE/scripts/cdn-bundle-size-build.sh"

            # A side whose measurement fails reads "not measured" and the other side is still reported.
            - name: Report both after the CDN minifier
              run: |
                  BUNDLES="dist/mparticle.js kits/rokt/dist/Rokt-Kit.iife.js"
                  node scripts/cdn-bundle-size.js measure "$RUNNER_TEMP/head.json" $BUNDLES || rm -f "$RUNNER_TEMP/head.json"
                  (cd "$RUNNER_TEMP/base" && node "$GITHUB_WORKSPACE/scripts/cdn-bundle-size.js" measure "$RUNNER_TEMP/base.json" $BUNDLES) || rm -f "$RUNNER_TEMP/base.json"
                  node scripts/cdn-bundle-size.js report "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" | tee -a "$GITHUB_STEP_SUMMARY"

    # Coverage is uploaded separately so instrumentation can't affect the
    # assertions in the test jobs above. Needs a CODECOV_TOKEN secret.
    coverage-core:
        name: Core Coverage
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Run NPM CI
              run: npm ci

            - name: Run Jest Tests with Coverage
              run: npm run test:jest:coverage

            - name: Upload Core Coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  flags: core

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs-coverage-core
                  path: ~/.npm/_logs

    coverage-rokt-kit:
        name: Rokt Kit Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Run NPM CI
              working-directory: kits/rokt
              run: npm ci

            - name: Run Vitest with Coverage
              working-directory: kits/rokt
              run: npm run test:coverage

            # Vitest emits kit-relative paths; Codecov needs repo-relative.
            - name: Re-root coverage paths onto the repository root
              run: sed -i 's|^SF:|SF:kits/rokt/|' kits/rokt/coverage/lcov.info

            - name: Upload Rokt Kit Coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./kits/rokt/coverage/lcov.info
                  flags: rokt-kit

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs-coverage-rokt-kit
                  path: ~/.npm/_logs

    # Test Stub can be run independent of other tests
    test-stub:
        name: 'Test Stub'
        runs-on: ubuntu-latest
        needs:
            - test-core
            - test-jest
            - build-bundle
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: latest

            - name: Run NPM CI
              run: npm ci

            - name: Install Firefox Latest
              uses: browser-actions/setup-firefox@latest

            - name: Log Firefox Version
              run: firefox --version

            - name: Run Stub Tests
              run: npm run test:stub

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    # Integration Tests run the same suite of tests against various build systems
    # to make sure our SDK will run in different environments

    test-integrations-require-js:
        name: 'Integration Tests: Require JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Require JS Test
            test_command: npm run test:requirejs
            branch_name: ${{ vars.GITHUB_SHA }}

    test-integrations-common-js-browserfy:
        name: 'Integration Tests: Browserfy Common JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Browserfy CJS Test
            test_command: npm run test:integrations:cjs:browserfy
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-common-js-webpack:
        name: 'Integration Tests: webpack Common JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: webpack CJS Test
            test_command: npm run test:integrations:cjs:webpack
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-common-js-rollup:
        name: 'Integration Tests: Rollup Common JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Rollup CJS Test
            test_command: npm run test:integrations:cjs:rollup
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:npm && npm run build:test-bundle

    test-integrations-module-js-webpack:
        name: 'Integration Tests: webpack Module JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: webpack Module Test
            test_command: npm run test:integrations:module:webpack
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:esm && npm run build:test-bundle

    test-integrations-module-js-rollup:
        name: 'Integration Tests: Rollup Module JS'
        uses: mParticle/mparticle-workflows/.github/workflows/web-run-test.yml@main
        needs:
            - test-core
            - test-jest
            - build-bundle
        with:
            test_command_label: Rollup Module Test
            test_command: npm run test:integrations:module:rollup
            branch_name: ${{ vars.GITHUB_SHA }}
            build_command: npm run build:esm && npm run build:test-bundle

    required-checks:
        name: Required checks
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        needs:
            - build-bundle
            - test-jest
            - test-core
            - test-stub
            - test-integrations-require-js
            - test-integrations-common-js-browserfy
            - test-integrations-common-js-webpack
            - test-integrations-common-js-rollup
            - test-integrations-module-js-webpack
            - test-integrations-module-js-rollup
            - run-kit-tests
            - cdn-minifier-check
        steps:
            - name: Verify required checks succeeded
              env:
                  NEEDS_JSON: ${{ toJson(needs) }}
              run: |
                  node -e '
                  const needs = JSON.parse(process.env.NEEDS_JSON || "{}");
                  const required = [
                      "build-bundle",
                      "test-jest",
                      "test-core",
                      "test-stub",
                      "test-integrations-require-js",
                      "test-integrations-common-js-browserfy",
                      "test-integrations-common-js-webpack",
                      "test-integrations-common-js-rollup",
                      "test-integrations-module-js-webpack",
                      "test-integrations-module-js-rollup",
                      "run-kit-tests",
                      "cdn-minifier-check",
                  ];
                  const failed = required.filter(job => needs[job]?.result !== "success");
                  for (const job of required) {
                      console.log(`${job}: ${needs[job]?.result ?? "missing"}`);
                  }
                  if (failed.length > 0) {
                      console.error(`Required checks not all successful: ${failed.join(", ")}`);
                      process.exit(1);
                  }
                  '

    build-local:
        name: Get Bundle Size from Current Branch
        runs-on: ubuntu-latest
        needs: build-bundle

        outputs:
            bundledLocal: ${{ steps.set-bundled-local.outputs.bundledLocal }}
            bundledLocalHuman: ${{ steps.set-bundled-local.outputs.bundledLocalHuman }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: latest 

            - name: Run NPM CI
              run: npm ci

            - name: Download Local Bundle
              uses: actions/download-artifact@v8
              with:
                  name: bundle-local

            - name: Compress Bundle
              run: npm run bundle

            - name: Report Bundle Size
              run: |
                  BUNDLED_LOCAL=$(ls -l dist/mparticle.min.js.gz | awk '{print $5}')
                  echo "BUNDLED_LOCAL=$BUNDLED_LOCAL" >> $GITHUB_ENV
                  BUNDLED_LOCAL_HUMAN=$(ls -lh dist/mparticle.min.js.gz | awk '{print $5}')
                  echo "BUNDLED_LOCAL_HUMAN=$BUNDLED_LOCAL_HUMAN" >> $GITHUB_ENV

            - name: Set Local Bundled Size
              id: set-bundled-local
              run: |
                  echo "bundledLocal=$BUNDLED_LOCAL" >> "$GITHUB_OUTPUT"
                  echo "bundledLocalHuman=$BUNDLED_LOCAL_HUMAN" >> "$GITHUB_OUTPUT"

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    build-master:
        name: Get Bundle Size from Master
        runs-on: ubuntu-latest
        needs: build-bundle

        outputs:
            bundledMaster: ${{ steps.set-bundled-master.outputs.bundledMaster }}
            bundledMasterHuman: ${{ steps.set-bundled-master.outputs.bundledMasterHuman }}

        steps:
            - name: Checkout Master
              uses: actions/checkout@v6
              with:
                  ref: master

            - name: NPM install
              uses: actions/setup-node@v7
              with:
                  node-version: latest

            - name: Compress Bundle
              run: npm run bundle

            - name: Report Bundle Size
              run: |
                  BUNDLED_MASTER=$(ls -l dist/mparticle.min.js.gz | awk '{print $5}')
                  echo "BUNDLED_MASTER=$BUNDLED_MASTER" >> $GITHUB_ENV
                  BUNDLED_MASTER_HUMAN=$(ls -lh dist/mparticle.min.js.gz | awk '{print $5}')
                  echo "BUNDLED_MASTER_HUMAN=$BUNDLED_MASTER_HUMAN" >> $GITHUB_ENV

            - name: Set Master Bundled Size
              id: set-bundled-master
              run: |
                  echo "bundledMaster=$BUNDLED_MASTER" >> "$GITHUB_OUTPUT"
                  echo "bundledMasterHuman=$BUNDLED_MASTER_HUMAN" >> "$GITHUB_OUTPUT"

            - name: Archive npm failure logs
              uses: actions/upload-artifact@v7.0.2
              if: failure()
              with:
                  name: npm-logs
                  path: ~/.npm/_logs

    calculate-bundled:
        name: Calculate Bundled Diff
        uses: ./.github/workflows/calculate-difference.yml
        needs:
            - build-master
            - build-local
        with:
            initial_bundle_size: ${{ needs.build-master.outputs.bundledMaster }}
            updated_bundle_size: ${{ needs.build-local.outputs.bundledLocal }}

    generate-report:
        name: Generate Report
        runs-on: ubuntu-latest
        needs:
            - build-master
            - build-local
            - calculate-bundled
        steps:
            - name: Adding Markdown
              env:
                  BUNDLED_MASTER_HUMAN: ${{ needs.build-master.outputs.bundledMasterHuman }}
                  BUNDLED_LOCAL_HUMAN: ${{ needs.build-local.outputs.bundledLocalHuman }}
                  DIFF_PERCENT: ${{ needs.calculate-bundled.outputs.diff_percent }}
              run: |
                  echo '### Calculate Bundle Size Difference' >> $GITHUB_STEP_SUMMARY
                  echo "|  | master | current | % changed |" >> $GITHUB_STEP_SUMMARY
                  echo "|--|--|--|--|" >> $GITHUB_STEP_SUMMARY
                  echo "| mparticle.min.js.gz | $BUNDLED_MASTER_HUMAN | $BUNDLED_LOCAL_HUMAN | $DIFF_PERCENT |" >> $GITHUB_STEP_SUMMARY

    pr-notify:
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        needs:
            - test-stub
            - test-integrations-require-js
            - test-integrations-common-js-browserfy
            - test-integrations-common-js-webpack
            - test-integrations-common-js-rollup
            - test-integrations-module-js-webpack
            - test-integrations-module-js-rollup
            - generate-report
        name: Notify GChat
        uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@main
        secrets:
            gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}
