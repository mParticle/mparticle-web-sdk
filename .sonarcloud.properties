# SonarCloud Automatic Analysis
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Karma/Jest suites repeat setup and assert blocks. Prettier rewrites
# those as "new" duplicated lines and trip the 3% new-code gate even
# when production code is unchanged. Analyze src as sources and test
# as tests so copy-paste detection applies to the SDK only.
sonar.sources=src
sonar.tests=test
